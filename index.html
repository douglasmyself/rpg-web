<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Dungeon Quest - O Sobrevivente</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      color: #e6edf3;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .game-card {
      background-color: #1c2128;
      border: 1px solid #30363d;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    .title {
      color: #00ff66;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 5px;
      text-align: center;
    }

    .account-level {
      color: #f0b429;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    /* ARENA VISUAL DE ANIMAÇÃO DO COMBATE */
    .battle-arena {
      width: 100%;
      height: 130px;
      background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
      border: 1px solid #30363d;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding: 15px;
      position: relative;
      overflow: hidden;
    }

    .character-sprite {
      font-size: 50px;
      transition: transform 0.4s ease, opacity 0.5s ease;
      position: relative;
      user-select: none;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5));
    }

    /* Efeitos e Animações CSS mais lentas e suaves */
    .anim-attack-hero {
      animation: attackHero 0.8s ease-in-out;
    }

    .anim-attack-enemy {
      animation: attackEnemy 0.8s ease-in-out;
    }

    .anim-hit {
      animation: takeHit 0.6s ease-in-out;
    }

    .anim-heal {
      animation: healEffect 0.8s ease-in-out;
    }

    .anim-defeat {
      transform: rotate(90deg) translateY(20px) !important;
      opacity: 0.6;
    }

    @keyframes attackHero {
      0% { transform: translateX(0); }
      50% { transform: translateX(70px) scale(1.2); }
      100% { transform: translateX(0); }
    }

    @keyframes attackEnemy {
      0% { transform: translateX(0); }
      50% { transform: translateX(-70px) scale(1.2); }
      100% { transform: translateX(0); }
    }

    @keyframes takeHit {
      0% { filter: drop-shadow(0 0 15px red); transform: scale(0.85); }
      25% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
      75% { transform: translateX(-5px); }
      100% { filter: none; transform: scale(1); }
    }

    @keyframes healEffect {
      0% { filter: drop-shadow(0 0 15px #00ff66); transform: scale(1); }
      50% { transform: scale(1.25) translateY(-12px); }
      100% { filter: none; transform: scale(1); }
    }

    /* Cards de Status (Herói e Inimigo) */
    .status-container {
      display: flex;
      gap: 15px;
      width: 100%;
      margin-bottom: 15px;
    }

    .status-card {
      flex: 1;
      background-color: #22272e;
      border: 1px solid #373e47;
      border-radius: 8px;
      padding: 12px;
    }

    .status-card h3 {
      font-size: 15px;
      color: #f08c00;
      margin-bottom: 8px;
    }

    .status-info {
      font-size: 13px;
      color: #adbac7;
      margin-bottom: 4px;
    }

    /* Caixa de Log */
    .log-box {
      width: 100%;
      height: 140px;
      background-color: #2d333b;
      border: 1px solid #373e47;
      border-radius: 6px;
      padding: 12px;
      overflow-y: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      line-height: 1.5;
      color: #adbac7;
      margin-bottom: 15px;
    }

    /* Placar estilo Fliperama */
    .scoreboard {
      width: 100%;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 12px;
    }

    .scoreboard h4 {
      color: #00ff66;
      margin-bottom: 5px;
      text-align: center;
      font-size: 13px;
    }

    .score-list {
      list-style: none;
      max-height: 70px;
      overflow-y: auto;
    }

    .score-list li {
      display: flex;
      justify-content: space-between;
      padding: 2px 5px;
      border-bottom: 1px dashed #30363d;
      color: #c9d1d9;
    }

    /* Botões de Ação */
    .actions-container {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.2s;
      min-width: 120px;
    }

    .btn-attack {
      background-color: #2ea043;
      color: #ffffff;
    }

    .btn-attack:hover {
      background-color: #3fb950;
    }

    .btn-skill {
      background-color: #a371f7;
      color: #ffffff;
    }

    .btn-skill:hover {
      background-color: #8a42f5;
    }

    .btn-potion {
      background-color: #f0b429;
      color: #1c2128;
    }

    .btn-potion:hover {
      background-color: #d49a1d;
    }

    .btn-restart {
      background-color: #f85149;
      color: #ffffff;
      width: 100%;
      margin-top: 5px;
    }

    .btn-restart:hover {
      background-color: #da3633;
    }

    .btn:disabled {
      background-color: #373e47;
      color: #768390;
      cursor: not-allowed;
    }

    /* Tela Inicial de Criação */
    .setup-container {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .setup-container input {
      flex: 1;
      background-color: #22272e;
      border: 1px solid #373e47;
      border-radius: 6px;
      color: #ffffff;
      padding: 10px;
      font-size: 14px;
    }

    .setup-container button {
      background-color: #2ea043;
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="game-card">
  <!-- RPG Dungeon Quest - Douglas Gomes de Almeida -->
  <div class="title">⚔️ O SOBREVIVENTE ⚔️</div>
  <div class="account-level" id="account-level">Nível de Conta: 1</div>

  <!-- ARENA ANIMADA DE BONEQUINHOS -->
  <div class="battle-arena" id="battle-arena" style="display: none;">
    <div class="character-sprite" id="sprite-hero">🛡️</div>
    <div class="character-sprite" id="sprite-enemy">🥷</div>
  </div>

  <!-- Cards de Status -->
  <div class="status-container" id="status-container" style="display: none;">
    <div class="status-card">
      <h3 id="hero-name-display">Herói</h3>
      <div class="status-info" id="hero-class-display">Guerreiro</div>
      <div class="status-info">Vida: <span id="hero-hp">140</span>/<span id="hero-hp-max">140</span></div>
      <div class="status-info">Kit Médico: <span id="hero-pots">3</span></div>
    </div>
    <div class="status-card">
      <h3 id="enemy-name">Inimigo</h3>
      <div class="status-info">Vida: <span id="enemy-hp">50</span></div>
    </div>
  </div>

  <!-- Placar de Recordes (Arcade) -->
  <div class="scoreboard" id="arcade-scoreboard">
    <h4>🕹️ Hall da Fama (Ranking de Score)</h4>
    <ul class="score-list" id="score-list">
      <li><span>Nenhum recorde ainda</span> <span>0 pts</span></li>
    </ul>
  </div>

  <!-- Caixa de Log das Mensagens -->
  <div class="log-box" id="log-box"></div>

  <!-- Botões de Ação na Batalha -->
  <div class="actions-container" id="actions-container" style="display: none;">
    <button class="btn btn-attack" id="btn-attack" onclick="atacar()">Atacar</button>
    <button class="btn btn-skill" id="btn-skill" onclick="usarHabilidade()">Habilidade</button>
    <button class="btn btn-potion" id="btn-potion" onclick="usarPocao()">Usar Kit Médico</button>
  </div>

  <!-- Botão de Reiniciar -->
  <button class="btn btn-restart" id="btn-restart" style="display: none;" onclick="reiniciarJogo()">Próximo Jogador</button>

  <!-- Input Inicial (Nome / Opções) -->
  <div class="setup-container" id="setup-container">
    <input type="text" id="setup-input" placeholder="Digite seu nome (ex: Douglas ou Amigo)..." autofocus>
    <button onclick="processarSetup()">Enviar</button>
  </div>
</div>

<script>
  // Variáveis em memória (sem localStorage, resetam ao atualizar a página)
  let nivelConta = 1;
  let rankingScores = [];

  let heroi = {
    nome: "Herói",
    classe: "Guerreiro",
    hp: 140,
    hpMax: 140,
    ataque: 18,
    pocoes: 3,
    habilidade: "Golpe de Escudo",
    cdHabilidade: 0,
    golpesGastos: 0,
    habilidadesGastas: 0,
    sprite: "⚔️"
  };

  let inimigo = {
    nome: "Ladrão",
    hp: 50,
    ataque: 12,
    sprite: "🥷"
  };

  const inimigosDungeon = [
    { nome: "Ladrão", hp: 50, ataque: 12, sprite: "🥷" },
    { nome: "Trapaceiro", hp: 80, ataque: 18, sprite: "👺" },
    { nome: "Dragão das Sombras (Chefe)", hp: 100, ataque: 28, sprite: "🐉" }
  ];

  let faseAtual = 0;
  let estado = "NOME";

  const spriteHeroElem = document.getElementById("sprite-hero");
  const spriteEnemyElem = document.getElementById("sprite-enemy");

  function atualizarPlacarHTML() {
    document.getElementById("account-level").innerText = `Nível de Conta: ${nivelConta}`;
    const lista = document.getElementById("score-list");
    lista.innerHTML = "";
    if (rankingScores.length === 0) {
      lista.innerHTML = `<li><span>Nenhum recorde ainda</span> <span>0 pts</span></li>`;
      return;
    }
    rankingScores.sort((a, b) => b.score - a.score);
    rankingScores.forEach(item => {
      lista.innerHTML += `<li><span>${item.nome} (${item.classe})</span> <strong>${item.score} pts</strong></li>`;
    });
  }

  function calcularEAdicionarScore(venceu) {
    let pontosVida = heroi.hp * 5;
    let bonusVitoria = venceu ? 500 : 100;
    let penalidadeAcoes = (heroi.golpesGastos * 5) + (heroi.habilidadesGastas * 10);
    
    let scoreFinal = Math.max(10, bonusVitoria + pontosVida - penalidadeAcoes);
    
    rankingScores.push({
      nome: heroi.nome,
      classe: heroi.classe,
      score: scoreFinal
    });
    
    atualizarPlacarHTML();

    log(`<br>🎮 **ESTATÍSTICAS DA PARTIDA DE ${heroi.nome.toUpperCase()}**:`);
    log(`⚔️ Golpes normais: ${heroi.golpesGastos} | 🔮 Habilidades: ${heroi.habilidadesGastas}`);
    log(`🏆 **SCORE FINAL: ${scoreFinal} PONTOS**`);
  }

  function log(mensagem) {
    const logBox = document.getElementById("log-box");
    logBox.innerHTML += (logBox.innerHTML ? "<br>" : "") + mensagem;
    logBox.scrollTop = logBox.scrollHeight;
  }

  function atualizarTela() {
    document.getElementById("hero-name-display").innerText = heroi.nome;
    document.getElementById("hero-class-display").innerText = heroi.classe;
    document.getElementById("hero-hp").innerText = heroi.hp;
    document.getElementById("hero-hp-max").innerText = heroi.hpMax;
    document.getElementById("hero-pots").innerText = heroi.pocoes;
    document.getElementById("enemy-name").innerText = inimigo.nome;
    document.getElementById("enemy-hp").innerText = inimigo.hp;

    spriteHeroElem.innerText = heroi.sprite;
    spriteEnemyElem.innerText = inimigo.sprite;

    const btnSkill = document.getElementById("btn-skill");
    btnSkill.innerText = `${heroi.habilidade}${heroi.cdHabilidade > 0 ? ` (${heroi.cdHabilidade})` : ''}`;
    btnSkill.disabled = (heroi.cdHabilidade > 0);
  }

  function iniciarCombate() {
    if (faseAtual >= inimigosDungeon.length) {
      log(`<br>========================================`);
      log(`🏆 PARABÉNS! ${heroi.nome}, VOCÊ ZEROU A MASMORRA!`);
      
      calcularEAdicionarScore(true);

      if (nivelConta < 3) {
        nivelConta++;
        let novoPersonagem = nivelConta === 2 ? "Soldado" : "Elite";
        log(`🎉 **NÍVEL DE CONTA SUBIU PARA ${nivelConta}! Desbloqueado: ${novoPersonagem.toUpperCase()}**`);
      } else if (nivelConta === 3) {
        nivelConta = 4;
        log(`👑 **NÍVEL MÁXIMO ATINGIDO! Desbloqueado: MESTRE!**`);
      }

      atualizarPlacarHTML();
      log(`========================================`);
      document.getElementById("actions-container").style.display = "none";
      document.getElementById("btn-restart").style.display = "block";
      document.getElementById("arcade-scoreboard").style.display = "block";
      
      spriteHeroElem.innerText = "👑";
      spriteEnemyElem.classList.add("anim-defeat");
      return;
    }

    let dadosInimigo = inimigosDungeon[faseAtual];
    inimigo.nome = dadosInimigo.nome;
    inimigo.hp = dadosInimigo.hp;
    inimigo.ataque = dadosInimigo.ataque;
    inimigo.sprite = dadosInimigo.sprite;

    spriteEnemyElem.classList.remove("anim-defeat");
    spriteHeroElem.classList.remove("anim-defeat");

    log(`<br>----------------------------------------`);
    log(`🚪 Entrando na Sala ${faseAtual + 1}...`);
    log(`⚠️ Um ${inimigo.nome} selvagem apareceu para o combate!`);

    document.getElementById("setup-container").style.display = "none";
    document.getElementById("status-container").style.display = "flex";
    document.getElementById("battle-arena").style.display = "flex";
    document.getElementById("actions-container").style.display = "flex";
    document.getElementById("btn-restart").style.display = "none";
    document.getElementById("arcade-scoreboard").style.display = "none";
    
    document.getElementById("btn-attack").disabled = false;
    document.getElementById("btn-potion").disabled = false;

    atualizarTela();
  }

  function processarSetup() {
    const input = document.getElementById("setup-input");
    let valor = input.value.trim();
    input.value = "";

    if (estado === "NOME") {
      if (!valor) return;
      heroi.nome = valor;
      log(`Jogador: ${heroi.nome}`);
      log(`<br>Escolha a sua Classe:`);
      log(`1. Guerreiro (Vida alta, Habilidade: Golpe de Escudo)`);
      log(`2. Mago (Dano alto, Habilidade: Impacto Mágico)`);
      
      if (nivelConta >= 2) log(`3. 🔓 Soldado (Equilibrado, Habilidade: Golpe de Escudo)`);
      if (nivelConta >= 3) log(`4. 🔓 Elite (Dano muito alto, Habilidade: Espada de Ouro)`);
      if (nivelConta >= 4) log(`5. 👑 Mestre (Classe Suprema, Habilidade: Bola de Fogo)`);

      input.placeholder = "Opção de classe...";
      estado = "CLASSE";
    } else if (estado === "CLASSE") {
      if (valor === "2") {
        heroi.classe = "Mago";
        heroi.hp = 100; heroi.hpMax = 100; heroi.ataque = 22;
        heroi.habilidade = "Impacto Mágico";
        heroi.sprite = "🧙‍♂️";
      } else if (valor === "3" && nivelConta >= 2) {
        heroi.classe = "Soldado";
        heroi.hp = 120; heroi.hpMax = 120; heroi.ataque = 20;
        heroi.habilidade = "Golpe de Escudo";
        heroi.sprite = "🪖";
      } else if (valor === "4" && nivelConta >= 3) {
        heroi.classe = "Elite";
        heroi.hp = 130; heroi.hpMax = 130; heroi.ataque = 26;
        heroi.habilidade = "Espada de Ouro";
        heroi.sprite = "🥷✨";
      } else if (valor === "5" && nivelConta >= 4) {
        heroi.classe = "Mestre";
        heroi.hp = 150; heroi.hpMax = 150; heroi.ataque = 32;
        heroi.habilidade = "Bola de Fogo";
        heroi.sprite = "🧙‍♂️🔥";
      } else {
        heroi.classe = "Guerreiro";
        heroi.hp = 140; heroi.hpMax = 140; heroi.ataque = 18;
        heroi.habilidade = "Golpe de Escudo";
        heroi.sprite = "🛡️";
      }

      heroi.pocoes = 3;
      heroi.cdHabilidade = 0;
      heroi.golpesGastos = 0;
      heroi.habilidadesGastas = 0;

      log(`✨ ${heroi.nome}, o seu ${heroi.classe} entrou na Masmorra!`);
      iniciarCombate();
    }
  }

  function animarAcao(atacante, alvo, tipo = "ataque") {
    const elemAtacante = atacante === "heroi" ? spriteHeroElem : spriteEnemyElem;
    const elemAlvo = alvo === "inimigo" ? spriteEnemyElem : spriteHeroElem;

    if (tipo === "ataque") {
      elemAtacante.classList.add(atacante === "heroi" ? "anim-attack-hero" : "anim-attack-enemy");
      setTimeout(() => {
        elemAtacante.classList.remove("anim-attack-hero", "anim-attack-enemy");
        elemAlvo.classList.add("anim-hit");
        setTimeout(() => elemAlvo.classList.remove("anim-hit"), 600);
      }, 400);
    } else if (tipo === "cura") {
      elemAtacante.classList.add("anim-heal");
      setTimeout(() => elemAtacante.classList.remove("anim-heal"), 800);
    }
  }

  function contraAtaqueInimigo() {
    animarAcao("inimigo", "heroi", "ataque");

    setTimeout(() => {
      let danoInimigo = Math.floor(Math.random() * 5) + (inimigo.ataque - 2);
      heroi.hp = Math.max(0, heroi.hp - danoInimigo);
      log(`💥 O ${inimigo.nome} contra-atacou e tirou ${danoInimigo} de vida!`);

      if (heroi.cdHabilidade > 0) heroi.cdHabilidade--;

      if (heroi.hp === 0) {
        log(`💀 Você foi derrotado na masmorra... Fim de jogo.`);
        spriteHeroElem.classList.add("anim-defeat");
        spriteHeroElem.innerText = "😵";
        calcularEAdicionarScore(false);
        document.getElementById("btn-attack").disabled = true;
        document.getElementById("btn-potion").disabled = true;
        document.getElementById("btn-skill").disabled = true;
        document.getElementById("btn-restart").style.display = "block";
        document.getElementById("arcade-scoreboard").style.display = "block";
      }

      atualizarTela();
    }, 400);
  }

  function atacar() {
    if (heroi.hp <= 0 || inimigo.hp <= 0) return;

    heroi.golpesGastos++;
    animarAcao("heroi", "inimigo", "ataque");

    setTimeout(() => {
      let danoHeroi = Math.floor(Math.random() * 6) + (heroi.ataque - 3);
      inimigo.hp = Math.max(0, inimigo.hp - danoHeroi);
      log(`🗡️ Você causou ${danoHeroi} de dano ao ${inimigo.nome}!`);

      if (inimigo.hp === 0) {
        log(`🏆 Você derrotou o ${inimigo.nome} com sucesso!`);
        spriteEnemyElem.classList.add("anim-defeat");
        spriteEnemyElem.innerText = "💫";
        faseAtual++;
        setTimeout(iniciarCombate, 1600);
        atualizarTela();
        return;
      }

      contraAtaqueInimigo();
    }, 400);
  }

  function usarHabilidade() {
    if (heroi.hp <= 0 || inimigo.hp <= 0 || heroi.cdHabilidade > 0) return;

    heroi.habilidadesGastas++;
    animarAcao("heroi", "inimigo", "ataque");

    setTimeout(() => {
      let danoEspecial = 0;

      if (heroi.habilidade === "Golpe de Escudo") {
        danoEspecial = heroi.ataque + 8;
        inimigo.hp = Math.max(0, inimigo.hp - danoEspecial);
        log(`🛡️💥 Você desferiu um GOLPE DE ESCUDO e causou ${danoEspecial} de dano ao ${inimigo.nome}!`);
        heroi.cdHabilidade = 2;
      } else if (heroi.habilidade === "Espada de Ouro") {
        danoEspecial = heroi.ataque + 18;
        inimigo.hp = Math.max(0, inimigo.hp - danoEspecial);
        log(`⚔️✨ VOCÊ USOU A ESPADA DE OURO! Causou ${danoEspecial} de dano crítico ao ${inimigo.nome}!`);
        heroi.cdHabilidade = 3;
      } else if (heroi.habilidade === "Bola de Fogo") {
        danoEspecial = heroi.ataque + 28;
        inimigo.hp = Math.max(0, inimigo.hp - danoEspecial);
        log(`🔥 DESTRUIÇÃO! Você lançou uma BOLA DE FOGO e causou ${danoEspecial} de dano ao ${inimigo.nome}!`);
        heroi.cdHabilidade = 3;
      } else {
        danoEspecial = heroi.ataque + 12;
        inimigo.hp = Math.max(0, inimigo.hp - danoEspecial);
        log(`✨ Você usou Impacto Mágico e causou ${danoEspecial} de dano ao ${inimigo.nome}!`);
        heroi.cdHabilidade = 2;
      }

      if (inimigo.hp === 0) {
        log(`🏆 Você derrotou o ${inimigo.nome} com sucesso!`);
        spriteEnemyElem.classList.add("anim-defeat");
        spriteEnemyElem.innerText = "💫";
        faseAtual++;
        setTimeout(iniciarCombate, 1600);
        atualizarTela();
        return;
      }

      contraAtaqueInimigo();
    }, 400);
  }

  function usarPocao() {
    if (heroi.hp <= 0 || inimigo.hp <= 0) return;

    if (heroi.pocoes > 0) {
      animarAcao("heroi", "heroi", "cura");
      let cura = 65;
      heroi.hp = Math.min(heroi.hpMax, heroi.hp + cura);
      heroi.pocoes--;
      log(`🧪 Você usou um Kit Médico e recuperou ${cura} de vida!`);
    } else {
      log(`❌ Você não tem mais Kit Médico!`);
      return;
    }

    contraAtaqueInimigo();
  }

  function reiniciarJogo() {
    faseAtual = 0;
    estado = "NOME";
    
    document.getElementById("log-box").innerHTML = "";
