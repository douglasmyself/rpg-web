<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RPG Dungeon Quest - O Sobrevivente</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#07090d;color:#e6edf3;font-family:'Segoe UI',system-ui,sans-serif;touch-action:manipulation}
#app{position:relative;height:100vh;height:100dvh;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding:max(6px,env(safe-area-inset-top)) 8px max(6px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700}
#tt{color:#ffb347;font-size:clamp(14px,3.8vw,20px);letter-spacing:.5px}
#lv{color:#7ee787;min-width:34%}
#mu{background:#1c2128;border:1px solid #373e47;color:#fff;border-radius:6px;padding:3px 10px;cursor:pointer;margin-left:auto}
#cv{flex:1;min-height:0;width:100%;border:1px solid #30363d;border-radius:10px;display:block}
#log{height:4em;font:12px/1.35 monospace;background:#12161d;border:1px solid #30363d;border-radius:8px;padding:4px 8px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;color:#8b98a5}
#log div:last-child{color:#fff}
#act{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.b{border:0;border-radius:8px;padding:10px 2px;font-weight:700;font-size:clamp(10px,2.9vw,13px);color:#fff;cursor:pointer;line-height:1.2;min-height:46px;transition:transform .1s,filter .15s}
.b:active:not(:disabled){transform:scale(.95)}
.b:hover:not(:disabled){filter:brightness(1.15)}
.b:disabled{opacity:.4;cursor:not-allowed}
.b:focus-visible,.hb:focus-visible,#nm:focus-visible{outline:2px solid #ffb347;outline-offset:2px}
.a0{background:#2ea043}.a1{background:#8957e5}.a2{background:#1f6feb}.a3{background:#d29922;color:#10141a}.g{background:#2ea043;padding:10px 18px}
.ov{position:absolute;inset:0;background:rgba(7,9,13,.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(5px,1.6vh,10px);padding:10px;z-index:5;text-align:center;border-radius:10px}
.ov.on{display:flex}
.ov h1{font-size:clamp(18px,5.2vw,28px);color:#ffb347}
.ov h2{font-size:clamp(15px,4.2vw,20px);color:#ffb347}
#msg,#hd{font-size:clamp(11px,3vw,14px);color:#9fb0c0;max-width:420px}
#nm{width:min(280px,80%);background:#1c2128;border:1px solid #373e47;border-radius:8px;color:#fff;padding:9px;font-size:15px;text-align:center}
#hs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(420px,100%)}
.hb{background:#1c2128;border:2px solid #30363d;color:#fff;border-radius:8px;padding:8px 2px;font-size:clamp(10px,2.9vw,13px);cursor:pointer}
.hb.sel{border-color:#ffb347;background:#2a2218}
.hb{white-space:pre-line;line-height:1.45}
.hb:disabled{opacity:.45;cursor:not-allowed}
#rk{font-size:clamp(10px,2.8vw,12px);color:#c9d1d9;width:min(300px,90%)}
#rk div{display:flex;justify-content:space-between;border-bottom:1px dashed #30363d;padding:2px 0}
#bo{display:flex;flex-direction:column;gap:8px;width:min(320px,90%)}
.hb canvas{width:100%;height:auto;aspect-ratio:140/150;display:block;border-radius:6px;margin-bottom:4px}
#buff{background:rgba(7,9,13,.45)}
@media (prefers-reduced-motion:reduce){.b{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header><span id="lv"></span><span id="tt">⚔️ O SOBREVIVENTE</span><button id="mu" aria-label="Som">🔊</button></header>
  <canvas id="cv"></canvas>
  <div id="log" aria-live="polite"></div>
  <div id="act">
    <button class="b a0" id="b0">⚔️ Atacar</button>
    <button class="b a1" id="b1">🔮 Habilidade</button>
    <button class="b a2" id="b2">🛡️ Defender</button>
    <button class="b a3" id="b3">🧪 Kit</button>
  </div>
  <div id="menu" class="ov on">
    <h1>⚔️ O SOBREVIVENTE ⚔️</h1>
    <p id="msg">Sobreviva a 10 salas e derrote os 2 chefes!</p>
    <input id="nm" maxlength="12" placeholder="Seu nome..." autocomplete="off">
    <button class="b g" id="nx">CONTINUAR</button>
    <div id="rk"></div>
  </div>
  <div id="pick" class="ov">
    <h2>🥷 Escolha seu ninja</h2>
    <div id="hs"></div>
    <p id="hd"></p>
    <button class="b g" id="go">JOGAR SOLO</button>
    <button class="b a2" id="ol">🌐 JOGAR ONLINE (2 JOGADORES)</button>
  </div>
  <div id="net" class="ov">
    <h2>🌐 Duelo online</h2>
    <p id="msg2" style="font-size:13px;color:#9fb0c0;max-width:340px">Um jogador cria a sala e passa o código; o outro digita o código e entra.</p>
    <button class="b g" id="mk">CRIAR SALA</button>
    <input id="cd" maxlength="5" placeholder="Código da sala" autocomplete="off" style="width:min(220px,80%);background:#1c2128;border:1px solid #373e47;border-radius:8px;color:#fff;padding:9px;font-size:16px;text-align:center;text-transform:uppercase">
    <button class="b a2" id="jn">ENTRAR NA SALA</button>
    <p id="ns" style="font-size:13px;min-height:2.6em;max-width:340px"></p>
    <button class="b a3" id="nb">VOLTAR</button>
  </div>
  <div id="buff" class="ov">
    <h2>🎁 Sala concluída! Escolha uma recompensa</h2>
    <div id="bo"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" crossorigin="anonymous"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const H=[
 {n:'Ninja do Raio',e:'⚡',hp:115,a:20,s:{n:'Lâmina de Raio',m:1.9,c:1,cd:2,d:'golpe crítico garantido'}},
 {n:'Ninja do Fogo',e:'🔥',hp:105,a:21,s:{n:'Esfera de Fogo',m:2.6,cd:3,d:'grande dano à distância'}},
 {n:'Ninja Curandeiro',e:'🌿',hp:150,a:17,s:{n:'Palma Curativa',m:1.2,hl:35,cd:3,d:'golpeia e cura 35 de vida'}}];
const EN=[['Gosma','🦠',45,9],['Morcego','🦇',55,11],['Esqueleto','💀',70,13],['Goblin','👺',85,14],['Ogro (Chefe)','👹',170,17,1],
 ['Aranha','🕷️',95,17],['Fantasma','👻',110,19],['Golem','🗿',140,21],['Demônio','😈',160,23],['Dragão (Chefe)','🐉',280,27,1]];
let PV=null,PR=null,TM=30,live=0,G=null,E=null,busy=0,lvl=1,sel=0,rank=[],ps=[],fx=[],L=[],mute=false;
let A={h:{l:0,f:0,d:0,p:0},e:{l:0,f:0,d:0,p:0},sh:0};
try{
  lvl=Math.min(6,Math.max(1,parseInt(localStorage.getItem('rpgLv'),10)||1));
  const r=JSON.parse(localStorage.getItem('rpgRk')||'[]');
  if(Array.isArray(r))rank=r.filter(x=>x&&typeof x.n==='string'&&typeof x.e==='string'&&Number.isFinite(x.s)).slice(0,5);
}catch(e){}
function save(){try{localStorage.setItem('rpgLv',lvl);localStorage.setItem('rpgRk',JSON.stringify(rank))}catch(e){}}

/* ===== SOM ===== */
let AC,mg,mi,ni=0;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.9;mg.connect(AC.destination)}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,f2,d,ty,v,t0){if(mute)return;try{const c=ac(),n=c.currentTime+(t0||0),o=c.createOscillator(),g=c.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime((v||.15)*1.7,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(mg);o.start(n);o.stop(n+d)}catch(e){}}
function noise(d,v,fr){if(mute)return;try{const c=ac(),n=c.currentTime,b=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=fr;g.gain.setValueAtTime(v*1.7,n);g.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(f);f.connect(g);g.connect(mg);s.start(n)}catch(e){}}
const S={
 click:()=>tone(500,700,.06,'square',.06),
 hit:()=>{noise(.1,.3,1500);tone(200,60,.14,'sawtooth',.14)},
 crit:()=>{noise(.18,.35,2500);tone(400,80,.25,'sawtooth',.2);tone(800,1200,.15,'square',.08,.05)},
 hurt:()=>{noise(.15,.3,500);tone(120,40,.25,'sawtooth',.2)},
 miss:()=>noise(.12,.1,4000),
 heal:()=>[523,659,784].forEach((f,i)=>tone(f,f,.18,'sine',.12,i*.09)),
 skill:()=>{tone(300,900,.3,'square',.1);noise(.25,.2,3000)},
 win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,f,.25,'triangle',.18,i*.12)),
 lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,f*.9,.35,'sawtooth',.15,i*.2))
};
const SW={
 sword:()=>{noise(.2,.35,3500);tone(1400,700,.35,'triangle',.12,.08)},
 dagger:()=>{noise(.12,.35,5000);tone(2200,1500,.2,'triangle',.1,.05)},
 rapier:()=>{noise(.15,.25,6000);tone(2600,1800,.4,'sine',.1,.05)},
 star:()=>{tone(900,1900,.25,'sine',.2);noise(.2,.2,6000)},
 axe:()=>{noise(.25,.4,900);tone(150,60,.25,'sawtooth',.2,.1)},
 club:()=>{noise(.15,.3,400);tone(90,40,.3,'square',.25,.1)},
 hammer:()=>{noise(.2,.3,300);tone(70,35,.4,'square',.3,.12)},
 spear:()=>{noise(.18,.35,2500);tone(500,1200,.15,'sawtooth',.12)},
 bow:()=>{tone(300,150,.15,'triangle',.3);tone(1200,400,.2,'sine',.1,.05)},
 staff:()=>{tone(500,1500,.3,'sawtooth',.15);tone(250,750,.3,'sine',.2)},
 claw:()=>{noise(.2,.3,700);tone(160,70,.25,'sawtooth',.2)}};
S.sw=w=>(SW[w]||SW.claw)();
const NT=[110,130.8,164.8,130.8,98,123.5,146.8,123.5];
function music(){clearInterval(mi);if(mute)return;mi=setInterval(()=>{const f=NT[ni%8];tone(f,f*.99,.9,'triangle',.06);if(ni%2===0)tone(f*4,f*4,.4,'sine',.02);ni++},500)}
$('mu').onclick=()=>{mute=!mute;$('mu').textContent=mute?'🔇':'🔊';mute?clearInterval(mi):(ac(),music())};

/* ===== CANVAS ===== */
const cv=$('cv');let ctx=cv.getContext('2d'),w=300,h=200,dpr=1;
function rs(){const r=cv.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);w=Math.max(1,r.width);h=Math.max(1,r.height);cv.width=w*dpr;cv.height=h*dpr}
window.addEventListener('resize',rs);if(window.ResizeObserver)new ResizeObserver(rs).observe(cv);rs();
const P=()=>({hx:w*.24,ex:w*.76,gy:h*.78,sz:Math.min(w*.27,h*.43)});
function burst(who,c,n){const p=P(),x=who==='h'?p.hx:p.ex,y=p.gy-p.sz*.45;for(let i=0;i<n;i++)ps.push({x,y,vx:(Math.random()-.5)*p.sz*3.4,vy:-Math.random()*p.sz*2.8,l:.7+Math.random()*.4,c,s:(2+Math.random()*3)*p.sz/75})}
function ft(who,t,c){const p=P();fx.push({x:who==='h'?p.hx:p.ex,y:p.gy-p.sz*1.1,t,c,l:1})}
const hpc=r=>r>.35?'#3fb950':'hsl('+Math.round(120*Math.max(0,r)/.35)+',75%,45%)';
function bar(x,y,bw,v,mx,nm,al,fs){const r=Math.max(0,v/mx),bh=fs+8;ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(x,y,bw,bh);ctx.fillStyle=hpc(r);ctx.fillRect(x+2,y+2,(bw-4)*r,bh-4);ctx.textBaseline='alphabetic';ctx.font='bold '+fs+'px sans-serif';ctx.fillStyle='#fff';ctx.textAlign=al;ctx.fillText(nm,al==='left'?x:x+bw,y-5);ctx.textAlign='center';ctx.font='bold '+(fs-2)+'px sans-serif';ctx.shadowColor='#000';ctx.shadowBlur=3;ctx.fillText(v+'/'+mx,x+bw/2,y+bh-6);ctx.shadowBlur=0}
function spr(em,x,y,sz,a,dir,ph,t,boss){
  ctx.save();
  const off=mvf(a.l>0?1-a.l:-1)*GP(sz)*dir,bob=Math.sin(t/280+ph)*sz*.04;
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(x,y+sz*.05,sz*.45,sz*.1,0,0,7);ctx.fill();
  ctx.translate(x+off,y-sz*.45+bob);
  if(a.d){ctx.rotate(-a.p*1.5*dir);ctx.translate(0,a.p*sz*.3);ctx.globalAlpha=1-a.p*.6}
  if(a.f>0&&((t/60)|0)%2)ctx.globalAlpha*=.35;
  ctx.font=sz+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor=boss?'#f33':'rgba(0,0,0,.6)';ctx.shadowBlur=boss?20:8;ctx.fillText(em,0,0);ctx.restore();
}
/* ===== PERSONAGENS COM CORPO ===== */
const HS=[
 {sk:'#e0ac69',cl:'#0f766e',tr:'#134e4a',w:'dagger',hair:'#7a4a24',band:'#2563eb'},
 {sk:'#f1c27d',cl:'#b91c1c',tr:'#450a0a',w:'star',hair:'#111',band:'#7f1d1d',cape:'#7f1d1d',glow:'#ff7a2f'},
 {sk:'#f1c27d',cl:'#15803d',tr:'#14532d',w:'sword',hair:'#8b5a2b',band:'#166534'}];
H.forEach((x,i)=>{x.f=HS[i]});
const ES={'Esqueleto':{sk:'#e8e4d0',cl:'#bdb7a0',tr:'#8a846e',w:'sword',eh:'💀'},
 'Goblin':{sk:'#6aa84f',cl:'#6b4a2b',tr:'#3e2a17',w:'axe',eh:'👺'},
 'Ogro (Chefe)':{sk:'#b5543a',cl:'#4a3224',tr:'#2a1b12',w:'club',eh:'👹',s:1.2},
 'Golem':{sk:'#8d96a0',cl:'#6b7480',tr:'#4a525c',w:'hammer',eh:'🗿',s:1.15},
 'Demônio':{sk:'#c0392b',cl:'#5a1020',tr:'#2a0a12',w:'spear',eh:'😈',cape:'#3a0a18',s:1.1}};
let pj=[],SHD=0;
const mvf=q=>q<0?0:q<.25?q/.25:q<.7?1:(1-q)/.3;
const GP=sz=>Math.max(0,w*.52-sz*.62);
function fig(x,y,sz,dir,a,t,f,boss){
  const u=sz/100*(f.s||1),q=a.l>0?1-a.l:-1,sn=q>=0?Math.sin(Math.PI*q):0,ph=t/(f.eh?330:380)+(dir<0?2:0),br=Math.sin(ph)*1.4,st=q>=0?sn*9:Math.sin(ph*.5)*1.5,rg=['bow','staff','star'].includes(f.w);
  const dn=a.d?a.p:0,flat=a.d===1;let ang=a.d?(flat?2.5:.1):.9+Math.sin(ph)*.05;
  if(q>=0&&!a.d)ang=rg?1.5+sn*.5:q<.3?.9+1.5*q/.3:q<.6?2.4-1.5*(q-.3)/.3:.9;
  const wa=f.w==='staff'?3.14-sn*1.2:ang+({hammer:.8,club:.8,axe:.8,spear:1.4}[f.w]||.9);
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(x,y+sz*.03,sz*.4,sz*.08,0,0,7);ctx.fill();
  ctx.translate(x+mvf(q)*(rg?0:GP(sz))*dir,y);ctx.scale(dir*u,u);
  if(a.d)ctx.rotate(flat?-dn*1.5:dn*.3);
  if(a.f>0&&((t/60)|0)%2)ctx.globalAlpha*=.4;
  if(SHD>0){
    ctx.fillStyle='rgba(88,166,255,.14)';ctx.strokeStyle='rgba(120,190,255,'+(.65+Math.sin(t/180)*.25)+')';ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(6,-50,40,60,0,0,7);ctx.fill();ctx.stroke();
    ctx.font='15px serif';ctx.textAlign='center';ctx.fillStyle='#fff';if(dir>0)ctx.fillText('🛡️×'+SHD,6,-118);
  }
  if(boss){ctx.shadowColor='#f33';ctx.shadowBlur=20}
  const ln=(x1,y1,x2,y2,w,c)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()};
  const dot=(cx,cy,r,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill()};
  if(f.cape){ctx.fillStyle=f.cape;ctx.beginPath();ctx.moveTo(-5,-72);ctx.lineTo(-26+Math.sin(ph*2)*3-st*.5,-20);ctx.lineTo(-4,-30);ctx.lineTo(5,-70);ctx.fill()}
  ln(-4,-38,-5-st,-3,8,f.tr);ln(4,-38,6+st,-3,8,f.tr);
  ctx.fillStyle='#222';ctx.fillRect(-10-st,-5,10,5);ctx.fillRect(2+st,-5,11,5);
  const bx=-3,by=-68+br*.4,ba=f.sh?.9:.35+Math.sin(ph+1)*.08,bhx=bx+26*Math.sin(ba),bhy=by+26*Math.cos(ba);
  ln(bx,by,bhx,bhy,7,f.cl);dot(bhx,bhy,4,f.sk);
  if(f.sh){dot(bhx+4,bhy,12,f.tr);ctx.strokeStyle='#e6b422';ctx.lineWidth=2;ctx.stroke();dot(bhx+4,bhy,3.5,'#e6b422')}
  ctx.fillStyle=f.cl;ctx.beginPath();ctx.moveTo(-10,-72+br*.4);ctx.lineTo(11,-72+br*.4);ctx.lineTo(8,-38);ctx.lineTo(-8,-38);ctx.closePath();ctx.fill();
  ctx.fillStyle=f.tr;ctx.fillRect(-8,-44,16,4);
  const hy=-84-br*.3+(flat?0:dn*9);
  if(f.eh){ctx.font='30px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(f.eh,3,hy)}
  else{
    dot(3,hy,11,f.sk);
    ctx.fillStyle=f.helm||f.hood||f.hat||f.hair;ctx.beginPath();ctx.arc(3,hy,11.5,Math.PI,0);ctx.fill();
    if(f.hat){ctx.beginPath();ctx.moveTo(-10,hy-5);ctx.lineTo(4,hy-32);ctx.lineTo(16,hy-5);ctx.fill()}
    ctx.fillStyle='#111';ctx.fillRect(8,hy-1,2.5,3);if(f.band){ctx.fillStyle=f.band;ctx.fillRect(-8.5,hy-7,23,4);ctx.fillStyle='#cbd5e1';ctx.fillRect(2,hy-8,7,6)}
    if(f.halo){ctx.strokeStyle='#ffe066';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(3,hy-17,9,3,0,0,7);ctx.stroke()}
  }
  const sx=5,sy=-68+br*.4,hx=sx+27*Math.sin(ang),hyy=sy+27*Math.cos(ang);
  ln(sx,sy,hx,hyy,7,f.cl);dot(hx,hyy,4,f.sk);
  ctx.save();ctx.translate(hx,hyy);
  if(f.w==='bow'){
    const pull=q>=0&&q<.4;
    ctx.strokeStyle='#8d5a2b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-24);ctx.quadraticCurveTo(pull?10:16,0,0,24);ctx.stroke();
    ctx.strokeStyle='#ddd';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(pull?-8:0,0);ctx.lineTo(0,24);ctx.stroke();
    if(pull){ctx.strokeStyle='#e8d9a0';ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(16,0);ctx.stroke()}
  }else if(f.w==='star'){ctx.rotate(t/100);ctx.fillStyle='#cbd5e1';ctx.shadowColor=f.glow;ctx.shadowBlur=10;ctx.beginPath();for(let k=0;k<8;k++){const r=k%2?3:9;ctx.lineTo(Math.cos(k*Math.PI/4)*r,Math.sin(k*Math.PI/4)*r)}ctx.fill()
  }else{
    ctx.rotate(-wa);const w=f.w,BL={sword:42,dagger:24,rapier:52}[w];
    if(BL){
      ctx.fillStyle='#6b4423';ctx.fillRect(-1.5,-4,3,8);ctx.fillStyle=w==='rapier'?'#c0392b':'#e6b422';ctx.fillRect(-6,4,12,3);
      const bw=w==='rapier'?1.3:2.5;ctx.fillStyle='#e8eef5';ctx.beginPath();ctx.moveTo(-bw,7);ctx.lineTo(bw,7);ctx.lineTo(bw*.6,BL);ctx.lineTo(0,BL+5);ctx.lineTo(-bw*.6,BL);ctx.fill();
    }else if(w==='hammer'||w==='axe'||w==='spear'){
      ctx.fillStyle='#7a4a24';ctx.fillRect(-1.5,-6,3,w==='spear'?60:38);
      if(w==='hammer'){ctx.fillStyle='#9aa4af';ctx.fillRect(-9,28,18,13);ctx.fillStyle='#e6b422';ctx.fillRect(-9,32,18,3)}
