<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Dungeon Quest - O Sobrevivente</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">
  <!-- Cabeçalho do Jogo -->
  <header class="game-header">
    <h1>⚔️ O SOBREVIVENTE ⚔️</h1>
    <p class="credits">RPG Dungeon Quest - Licenciatura em Computação</p>
  </header>

  <!-- Painel Visual de Status (HUD) -->
  <div class="hud-panel" id="hudPanel" style="display: none;">
    <div class="fighter-card">
      <span id="hudHeroName" class="fighter-name">Herói</span>
      <div class="health-bar-container">
        <div id="hudHeroHpBar" class="health-bar hero-bar" style="width: 100%;"></div>
      </div>
      <span id="hudHeroHpText" class="fighter-hp">HP: 100/100</span>
      <span id="hudHeroPocoes" class="fighter-extra">🧪 Kits: 2</span>
    </div>

    <div class="vs-badge">VS</div>

    <div class="fighter-card">
      <span id="hudEnemyName" class="fighter-name">Inimigo</span>
      <div class="health-bar-container">
        <div id="hudEnemyHpBar" class="health-bar enemy-bar" style="width: 100%;"></div>
      </div>
      <span id="hudEnemyHpText" class="fighter-hp">HP: 50/50</span>
    </div>
  </div>

  <!-- Ecrã de Registo de Aventuras (Consola de Texto) -->
  <div id="output" class="output"></div>

  <!-- Controlos -->
  <div class="controls">
    <input type="text" id="input" placeholder="Digite sua escolha e pressione Enter..." autofocus>
    <button onclick="processarEntrada()">Enviar</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
