<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Sobrevivente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>⚔️ O SOBREVIVENTE ⚔️</h1>
        
        <div class="stats-panel">
            <div class="card">
                <h3>Herói</h3>
                <p id="hero-name">Guerreiro</p>
                <p>Vida: <span id="hero-hp">140</span>/140</p>
                <p>Kit Médico: <span id="hero-pots">2</span></p>
            </div>
            <div class="card">
                <h3>Inimigo</h3>
                <p id="enemy-name">Ladrão</p>
                <p>Vida: <span id="enemy-hp">50</span></p>
            </div>
        </div>

        <div id="log-box" class="log-box">
            A masmorra aguarda por você. O combate vai começar!
        </div>

        <div class="controls">
            <button onclick="atacar()" id="btn-attack">Atacar</button>
            <button onclick="usarPocao()" id="btn-potion">Usar Kit Médico</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
