<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Dungeon Quest - O Sobrevivente</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      color: #e6edf3;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .game-card {
      background-color: #1c2128;
      border: 1px solid #30363d;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title {
      color: #00ff66;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Cards de Status (Herói e Inimigo) */
    .status-container {
      display: flex;
      gap: 15px;
      width: 100%;
      margin-bottom: 20px;
    }

    .status-card {
      flex: 1;
      background-color: #22272e;
      border: 1px solid #373e47;
      border-radius: 8px;
      padding: 14px;
    }

    .status-card h3 {
      font-size: 16px;
      color: #f08c00;
      margin-bottom: 10px;
    }

    .status-info {
      font-size: 14px;
      color: #adbac7;
      margin-bottom: 6px;
    }

    /* Caixa de Log */
    .log-box {
      width: 100%;
      height: 180px;
      background-color: #2d333b;
      border: 1px solid #373e47;
      border-radius: 6px;
      padding: 12px;
      overflow-y: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      line-height: 1.5;
      color: #adbac7;
      margin-bottom: 20px;
    }

    /* Botões de Ação */
    .actions-container {
      display: flex;
      gap: 15px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-attack {
      background-color: #2ea043;
      color: #ffffff;
    }

    .btn-attack:hover {
      background-color: #3fb950;
    }

    .btn-potion {
      background-color: #f0b429;
      color: #1c2128;
    }

    .btn-potion:hover {
      background-color: #d49a1d;
    }

    .btn:disabled {
      background-color: #373e47;
      color: #768390;
      cursor: not-allowed;
    }

    /* Tela Inicial de Criação */
    .setup-container {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .setup-container input {
      flex: 1;
      background-color: #22272e;
      border: 1px solid #373e47;
      border-radius: 6px;
      color: #ffffff;
      padding: 10px;
      font-size: 14px;
    }

    .setup-container button {
      background-color: #2ea043;
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="game-card">
  <!-- RPG Dungeon Quest - Douglas Gomes -->
  <div class="title">⚔️ O SOBREVIVENTE ⚔️</div>

  <!-- Cards de Status -->
  <div class="status-container" id="status-container" style="display: none;">
    <div class="status-card">
      <h3 id="hero-name-display">Herói</h3>
      <div class="status-info" id="hero-class-display">Guerreiro</div>
      <div class="status-info">Vida: <span id="hero-hp">140</span>/<span id="hero-hp-max">140</span></div>
      <div class="status-info">Kit Médico: <span id="hero-pots">2</span></div>
    </div>
    <div class="status-card">
      <h3 id="enemy-name">Inimigo</h3>
      <div class="status-info">Vida: <span id="enemy-hp">50</span></div>
    </div>
  </div>

  <!-- Caixa de Log das Mensagens -->
  <div class="log-box" id="log-box"></div>

  <!-- Botões de Ação na Batalha -->
  <div class="actions-container" id="actions-container" style="display: none;">
    <button class="btn btn-attack" id="btn-attack" onclick="atacar()">Atacar</button>
    <button class="btn btn-potion" id="btn-potion" onclick="usarPocao()">Usar Kit Médico</button>
  </div>

  <!-- Input Inicial (Nome / Opções) -->
  <div class="setup-container" id="setup-container">
    <input type="text" id="setup-input" placeholder="Digite seu nome..." autofocus>
    <button onclick="processarSetup()">Enviar</button>
  </div>
</div>

<script>
  let heroi = {
    nome: "Herói",
    classe: "Guerreiro",
    hp: 140,
    hpMax: 140,
    ataque: 18,
    pocoes: 2
  };

  let inimigo = {
    nome: "Ladrão",
    hp: 50,
    ataque: 12
  };

  const inimigosDungeon = [
    { nome: "Ladrão", hp: 50, ataque: 12 },
    { nome: "Trapaceiro", hp: 80, ataque: 18 },
    { nome: "Dragão das Sombras (Chefe)", hp: 100, ataque: 28 }
  ];

  let faseAtual = 0;
  let estado = "NOME";

  function log(mensagem) {
    const logBox = document.getElementById("log-box");
    logBox.innerHTML += (logBox.innerHTML ? "<br>" : "") + mensagem;
    logBox.scrollTop = logBox.scrollHeight;
  }

  function atualizarTela() {
    document.getElementById("hero-name-display").innerText = heroi.nome;
    document.getElementById("hero-class-display").innerText = heroi.classe;
    document.getElementById("hero-hp").innerText = heroi.hp;
    document.getElementById("hero-hp-max").innerText = heroi.hpMax;
    document.getElementById("hero-pots").innerText = heroi.pocoes;
    document.getElementById("enemy-name").innerText = inimigo.nome;
    document.getElementById("enemy-hp").innerText = inimigo.hp;
  }

  function iniciarCombate() {
    if (faseAtual >= inimigosDungeon.length) {
      log(`<br>========================================`);
      log(`🏆 PARABÉNS! ${heroi.nome}, VOCÊ ZEROU A MASMORRA!`);
      log(`========================================`);
      document.getElementById("actions-container").style.display = "none";
      return;
    }

    let dadosInimigo = inimigosDungeon[faseAtual];
    inimigo.nome = dadosInimigo.nome;
    inimigo.hp = dadosInimigo.hp;
    inimigo.ataque = dadosInimigo.ataque;

    log(`<br>----------------------------------------`);
    log(`🚪 Entrando na Sala ${faseAtual + 1}...`);
    log(`⚠️ Um ${inimigo.nome} selvagem apareceu para o combate!`);

    document.getElementById("setup-container").style.display = "none";
    document.getElementById("status-container").style.display = "flex";
    document.getElementById("actions-container").style.display = "flex";
    
    document.getElementById("btn-attack").disabled = false;
    document.getElementById("btn-potion").disabled = false;

    atualizarTela();
  }

  function processarSetup() {
    const input = document.getElementById("setup-input");
    let valor = input.value.trim();
    input.value = "";

    if (estado === "NOME") {
      if (!valor) return;
      heroi.nome = valor;
      log(`Digite o nome do seu herói: ${heroi.nome}`);
      log(`<br>Escolha a sua Classe:`);
      log(`1. Guerreiro (Mais Vida, ataque equilibrado)`);
      log(`2. Mago (Ataque mais forte, menos Vida)`);
      input.placeholder = "Opção (1 ou 2)...";
      estado = "CLASSE";
    } else if (estado === "CLASSE") {
      if (valor === "2") {
        heroi.classe = "Mago";
        heroi.hp = 100;
        heroi.hpMax = 100;
        heroi.ataque = 25;
        heroi.pocoes = 3;
      } else {
        heroi.classe = "Guerreiro";
        heroi.hp = 140;
        heroi.hpMax = 140;
        heroi.ataque = 18;
        heroi.pocoes = 2;
      }
      log(`✨ ${heroi.nome} o Seu ${heroi.classe} entrou na Masmorra!`);
      iniciarCombate();
    }
  }

  function atacar() {
    if (heroi.hp <= 0 || inimigo.hp <= 0) return;

    // Dano do herói
    let danoHeroi = Math.floor(Math.random() * 6) + (heroi.ataque - 3);
    inimigo.hp = Math.max(0, inimigo.hp - danoHeroi);
    log(`🗡️ Causaste ${danoHeroi} de dano ao ${inimigo.nome}!`);

    if (inimigo.hp === 0) {
      log(`🏆 Derrotaste o ${inimigo.nome} com sucesso!`);
      faseAtual++;
      setTimeout(iniciarCombate, 1200);
      atualizarTela();
      return;
    }

    // Contra-ataque do inimigo
    let danoInimigo = Math.floor(Math.random() * 5) + (inimigo.ataque - 2);
    heroi.hp = Math.max(0, heroi.hp - danoInimigo);
    log(`💥 O ${inimigo.nome} contra-atacou e tirou ${danoInimigo} de HP!`);

    if (heroi.hp === 0) {
      log(`💀 Foste derrotado na masmorra... Fim de jogo.`);
      document.getElementById("btn-attack").disabled = true;
      document.getElementById("btn-potion").disabled = true;
    }

    atualizarTela();
  }

  function usarPocao() {
    if (heroi.hp <= 0 || inimigo.hp <= 0) return;

    if (heroi.pocoes > 0) {
      let cura = 65;
      heroi.hp = Math.min(heroi.hpMax, heroi.hp + cura);
      heroi.pocoes--;
      log(`🧪 Usaste um Kit Médico e recuperaste ${cura} de HP!`);
    } else {
      log(`❌ Não tens mais Kit Médico!`);
      return;
    }

    // Inimigo ataca enquanto usa a poção
    let danoInimigo = Math.floor(Math.random() * 5) + (inimigo.ataque - 2);
    heroi.hp = Math.max(0, heroi.hp - danoInimigo);
    log(`💥 Enquanto bebias a poção, o ${inimigo.nome} atacou e tirou ${danoInimigo} de HP!`);

    if (heroi.hp === 0) {
      log(`💀 Foste derrotado na masmorra... Fim de jogo.`);
      document.getElementById("btn-attack").disabled = true;
      document.getElementById("btn-potion").disabled = true;
    }

    atualizarTela();
  }

  // Tecla Enter no input de nome
  document.getElementById("setup-input").addEventListener("keypress", function(e) {
    if (e.key === "Enter") processarSetup();
  });

  // Início
  log("========================================");
  log("        ⚔️ O SOBREVIVENTE ⚔️");
  log("========================================");
  log("Digite o nome do seu herói:");
</script>

</body>
</html>
