<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RPG Dungeon Quest - O Sobrevivente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#07090d;color:#e6edf3;font-family:'Segoe UI',system-ui,sans-serif;touch-action:manipulation}
#app{position:relative;height:100vh;height:100dvh;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding:max(6px,env(safe-area-inset-top)) 8px max(6px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700}
#tt{color:#ffb347;font-size:clamp(14px,3.8vw,20px);letter-spacing:.5px}
#lv{color:#7ee787;min-width:34%}
#mu{background:#1c2128;border:1px solid #373e47;color:#fff;border-radius:6px;padding:3px 10px;cursor:pointer;margin-left:auto}
#cv{flex:1;min-height:0;width:100%;border:1px solid #30363d;border-radius:10px;display:block}
#act{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.b{border:0;border-radius:8px;padding:10px 2px;font-weight:700;font-size:clamp(10px,2.9vw,13px);color:#fff;cursor:pointer;line-height:1.2;min-height:46px;transition:transform .1s,filter .15s}
.b:active:not(:disabled){transform:scale(.95)}
.b:hover:not(:disabled){filter:brightness(1.15)}
.b:disabled{opacity:.4;cursor:not-allowed}
.b:focus-visible,.hb:focus-visible,#nm:focus-visible,#sq:focus-visible,#cd:focus-visible,#sg:focus-visible,#stp:focus-visible{outline:2px solid #ffb347;outline-offset:2px}
.a0{background:#2ea043}.a1{background:#8957e5}.a2{background:#1f6feb}.a3{background:#d29922;color:#10141a}.g{background:#2ea043;padding:10px 18px}
.ov{position:absolute;inset:0;background:rgba(7,9,13,.95);display:none;flex-direction:column;align-items:center;justify-content:flex-start;gap:clamp(5px,1.6vh,10px);padding:10px;z-index:5;text-align:center;border-radius:10px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov>:first-child{margin-top:auto}
.ov>:last-child{margin-bottom:auto}
.ov.on{display:flex}
.ov h1{font-size:clamp(18px,5.2vw,28px);color:#ffb347}
.ov h2{font-size:clamp(15px,4.2vw,20px);color:#ffb347}
#msg,#hd{font-size:clamp(11px,3vw,14px);color:#9fb0c0;max-width:420px}
#nm{width:min(280px,80%);background:#1c2128;border:1px solid #373e47;border-radius:8px;color:#fff;padding:9px;font-size:16px;text-align:center}
#hs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(420px,100%)}
.hb{background:#1c2128;border:2px solid #30363d;color:#fff;border-radius:8px;padding:8px 2px;font-size:clamp(10px,2.9vw,13px);cursor:pointer}
.hb.sel{border-color:#ffb347;background:#2a2218}
.hb{white-space:pre-line;line-height:1.45}
.hb:disabled{opacity:.45;cursor:not-allowed}
#bo{display:flex;flex-direction:column;gap:8px;width:min(320px,90%)}
.hb canvas{width:100%;height:auto;aspect-ratio:140/150;display:block;border-radius:6px;margin-bottom:4px}
#buff{background:rgba(7,9,13,.45)}
.b{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;text-shadow:0 2px 0 rgba(0,0,0,.4);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 5px 0 var(--d,#0f6b30),0 9px 14px rgba(0,0,0,.5)}
.b:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 1px 0 var(--d,#0f6b30),0 3px 6px rgba(0,0,0,.5)}
.a0{background:linear-gradient(#4ade80,#16a34a);--d:#0f6b30}
.a1{background:linear-gradient(#c084fc,#7e22ce);--d:#4c1380}
.a2{background:linear-gradient(#60a5fa,#1d4ed8);--d:#133a94}
.a3{background:linear-gradient(#fcd34d,#d97706);--d:#8a4b04;color:#1b1203;text-shadow:none}
.g{background:linear-gradient(#4ade80,#16a34a);--d:#0f6b30;padding:12px 20px}
#act{gap:9px;padding:2px 2px 10px}
#act .b{min-height:clamp(66px,11.5vh,92px);padding:6px 2px}
.b i{font-style:normal;font-size:clamp(24px,7.2vw,36px);line-height:1}
.b span{font-size:clamp(10px,2.9vw,13px);line-height:1.1}
.b em{position:absolute;top:-8px;right:-4px;min-width:24px;height:24px;padding:0 5px;border-radius:999px;background:#ef4444;border:2px solid #fff;color:#fff;font-style:normal;font-size:13px;display:grid;place-items:center;text-shadow:none}
.err{border-color:#ef4444!important;animation:shk .35s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* conta Google */
#au{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
#ai{display:flex;align-items:center;justify-content:center;gap:8px 12px;flex-wrap:wrap;font-size:clamp(13px,3.6vw,15px)}
#an{font-weight:700;color:#fff}
#ab{color:#ffd23f;font-weight:700}
#lo{background:#1c2128;border:1px solid #373e47;color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
/* ranking */
#rk{width:min(390px,94%);font-size:clamp(12px,3.3vw,14px);color:#e6edf3;display:flex;flex-direction:column;gap:6px}
#rt{font-weight:800;color:#ffb347;letter-spacing:1px;font-size:clamp(13px,3.6vw,16px)}
#sf{display:flex;gap:6px}
#sq{flex:1;min-width:0;background:#1c2128;border:1px solid #373e47;border-radius:8px;color:#fff;padding:8px 10px;font-size:16px}
#sg,#stp{background:#1f6feb;border:0;border-radius:8px;color:#fff;padding:0 13px;font-size:17px;cursor:pointer;min-height:38px}
#stp{background:#d29922}
#rl{max-height:min(32vh,260px);overflow-y:auto;text-align:left;-webkit-overflow-scrolling:touch}
.rr{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:baseline;border-bottom:1px dashed #30363d;padding:5px 3px}
.rr b{color:#ffd23f;font-size:1.15em}
.rr small{color:#8b98a5;min-width:70px;text-align:right}
.rr.me{background:rgba(255,179,71,.12);border-radius:6px}
.rr.cl{cursor:pointer}
.rn{padding:8px;color:#9fb0c0;text-align:center;font-size:12px}
/* online */
.hid{display:none!important}
.sp{width:44px;height:44px;border:5px solid #30363d;border-top-color:#ffb347;border-radius:50%;animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.np{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.np .b{min-width:min(260px,80%)}
.nt{font-size:13px;color:#9fb0c0;max-width:340px}
#sw{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:84px}
#ns{font-size:14px;max-width:340px;color:#9fb0c0;line-height:1.4}
.code{background:#10141a;border:2px dashed #ffb347;border-radius:12px;padding:8px 22px;display:flex;flex-direction:column;gap:2px}
.code small{font-size:11px;color:#9fb0c0;letter-spacing:1px}
.code b{font-size:clamp(30px,10vw,44px);letter-spacing:6px;color:#ffb347;font-family:'Rajdhani',system-ui,sans-serif}
#cd{width:min(220px,80%);background:#1c2128;border:1px solid #373e47;border-radius:8px;color:#fff;padding:9px;font-size:16px;text-align:center;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.b{transition:none}.sp{animation-duration:2.4s}}
</style>
</head>
<body>
<div id="app">
  <header><span id="lv"></span><span id="tt">⚔️ O SOBREVIVENTE</span><button id="mu" aria-label="Som">🔊</button></header>
  <canvas id="cv"></canvas>
  <div id="act">
    <button class="b a0" id="b0"><i>⚔️</i><span>Atacar</span></button>
    <button class="b a1" id="b1"><i>🔮</i><span>Habilidade</span></button>
    <button class="b a2" id="b2"><i>🛡️</i><span>Defender</span></button>
    <button class="b a3" id="b3"><i>🧪</i><span>Kit Médico</span></button>
  </div>
  <div id="menu" class="ov on">
    <h1>⚔️ O SOBREVIVENTE ⚔️</h1>
    <p id="msg">Sobreviva a 10 salas e derrote os 2 chefes!</p>
    <div id="au" class="hid">
      <button class="b a2" id="gl">🔐 ENTRAR COM GOOGLE</button>
      <div id="ai" class="hid"><span id="an"></span><span id="ab"></span><button type="button" id="lo">Sair</button></div>
    </div>
    <input id="nm" maxlength="12" placeholder="Seu nome..." autocomplete="off">
    <button class="b g" id="nx">CONTINUAR</button>
    <div id="rk">
      <div id="rt">🏆 TOP 10</div>
      <form id="sf" autocomplete="off">
        <input id="sq" maxlength="12" placeholder="Buscar jogador pelo nome..." autocomplete="off" enterkeyhint="search">
        <button type="submit" id="sg" aria-label="Buscar">🔍</button>
        <button type="button" id="stp" aria-label="Voltar ao Top 10">🏆</button>
      </form>
      <div id="rl"></div>
    </div>
  </div>
  <div id="pick" class="ov">
    <h2>🥷 Escolha seu ninja</h2>
    <div id="hs"></div>
    <p id="hd"></p>
    <button class="b g" id="go">JOGAR SOLO</button>
    <button class="b a2" id="ol">🌐 JOGAR ONLINE (2 JOGADORES)</button>
  </div>
  <div id="net" class="ov">
    <h2>🌐 Duelo online</h2>
    <div id="n0" class="np">
      <p class="nt">Um jogador cria a sala e passa o código; o outro escolhe “Entrar com código”.</p>
      <button class="b g" id="mk">CRIAR SALA</button>
      <button class="b a2" id="jn0">ENTRAR COM CÓDIGO</button>
    </div>
    <div id="n1" class="np hid">
      <div id="cb" class="code hid"><small>CÓDIGO DA SALA</small><b id="cc"></b></div>
      <button class="b a2 hid" id="cp">📋 COPIAR CÓDIGO</button>
    </div>
    <div id="n2" class="np hid">
      <input id="cd" maxlength="5" placeholder="Código da sala" autocomplete="off" autocapitalize="characters">
      <button class="b a2" id="jn">ENTRAR NA SALA</button>
    </div>
    <div id="sw" class="hid"><div class="sp" id="sp"></div><p id="ns" role="status"></p></div>
    <button class="b a3" id="nb">VOLTAR</button>
  </div>
  <div id="buff" class="ov">
    <h2>🎁 Sala concluída! Escolha uma recompensa</h2>
    <div id="bo"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);

/* ===== CONFIGURAÇÃO ===== */
// RANKING ONLINE: URL do seu Firebase Realtime Database.
const DB='https://rgb-web-d6f46-default-rtdb.firebaseio.com/';
const DBU=DB.trim().replace(/\/+$/,'');
// LOGIN COM GOOGLE: cole aqui a configuração do app Web do seu projeto Firebase
// (Console do Firebase > Configurações do projeto > Seus apps > App da Web > firebaseConfig).
// Enquanto apiKey estiver vazio, o jogo continua pedindo o nome digitado, como antes.
const FB={apiKey:'',authDomain:'',projectId:'',appId:''};
// MODO ONLINE: servidores usados para furar firewall/NAT.
// (opcional) Se ainda falhar em algumas redes, crie uma conta grátis em metered.ca
// e cole aqui os servidores TURN que ela gerar, no formato {urls:'turn:...',username:'...',credential:'...'}
const TURN_EXTRA=[];
const ICE=[
 {urls:'stun:stun.l.google.com:19302'},
 {urls:'stun:global.stun.twilio.com:3478'},
 {urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'}
].concat(TURN_EXTRA);
const IDLE=6; // segundos parado antes do inimigo atacar (ou de perder a vez no online)

const H=[
 {n:'Ninja do Raio',e:'⚡',hp:115,a:20,s:{n:'Martelo do Trovão',m:1.9,c:1,cd:2,d:'golpe crítico garantido'}},
 {n:'Ninja do Fogo',e:'🔥',hp:105,a:21,s:{n:'Esfera de Fogo',m:2.6,cd:3,d:'grande dano à distância'}},
 {n:'Ninja Curandeiro',e:'🌿',hp:150,a:17,s:{n:'Palma Curativa',m:1.2,hl:35,cd:3,d:'golpeia e cura 35 de vida'}}];
const DHP=1.25,DDM=1.3; // dificuldade: vida e dano dos inimigos
const EN=[['Gosma','🦠',45,9],['Morcego','🦇',55,11],['Esqueleto','💀',70,13],['Goblin','👺',85,14],['Ogro (Chefe)','👹',170,17,1],
 ['Aranha','🕷️',95,17],['Fantasma','👻',110,19],['Golem','🗿',140,21],['Demônio','😈',160,23],['Dragão (Chefe)','🐉',280,27,1]];
let PV=null,PR=null,TM=30,live=0,G=null,E=null,busy=0,lvl=1,sel=0,rank=[],ps=[],fx=[],L=[],mute=false,ID=IDLE,pend=[],TOP=[],SUBP=null,RQ=0;
let A={h:{l:0,f:0,d:0,p:0},e:{l:0,f:0,d:0,p:0},sh:0};
let FBON=false,AU=null,USER=null,myBest=0;
const okE=x=>x&&typeof x.n==='string'&&typeof x.e==='string'&&Number.isFinite(x.s);
try{
  lvl=Math.min(6,Math.max(1,parseInt(localStorage.getItem('rpgLv'),10)||1));
  const r=JSON.parse(localStorage.getItem('rpgRk')||'[]');
  if(Array.isArray(r))rank=r.filter(okE).slice(0,10);
  const p=JSON.parse(localStorage.getItem('rpgPd')||'[]');
  if(Array.isArray(p))pend=p.filter(okE).slice(-5);
}catch(e){}
function save(){try{localStorage.setItem('rpgLv',lvl);localStorage.setItem('rpgRk',JSON.stringify(rank));localStorage.setItem('rpgPd',JSON.stringify(pend))}catch(e){}}

/* ===== SOM ===== */
let AC,mg,mi,ni=0;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.9;mg.connect(AC.destination)}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,f2,d,ty,v,t0){if(mute)return;try{const c=ac(),n=c.currentTime+(t0||0),o=c.createOscillator(),g=c.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime((v||.15)*1.7,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(mg);o.start(n);o.stop(n+d)}catch(e){}}
function noise(d,v,fr){if(mute)return;try{const c=ac(),n=c.currentTime,b=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=fr;g.gain.setValueAtTime(v*1.7,n);g.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(f);f.connect(g);g.connect(mg);s.start(n)}catch(e){}}
const S={
 click:()=>tone(500,700,.06,'square',.06),
 hit:()=>{noise(.1,.3,1500);tone(200,60,.14,'sawtooth',.14)},
 crit:()=>{noise(.18,.35,2500);tone(400,80,.25,'sawtooth',.2);tone(800,1200,.15,'square',.08,.05)},
 hurt:()=>{noise(.15,.3,500);tone(120,40,.25,'sawtooth',.2)},
 miss:()=>noise(.12,.1,4000),
 heal:()=>[523,659,784].forEach((f,i)=>tone(f,f,.18,'sine',.12,i*.09)),
 skill:()=>{tone(300,900,.3,'square',.1);noise(.25,.2,3000)},
 win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,f,.25,'triangle',.18,i*.12)),
 lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,f*.9,.35,'sawtooth',.15,i*.2))
};
const SW={
 sword:()=>{noise(.2,.35,3500);tone(1400,700,.35,'triangle',.12,.08)},
 dagger:()=>{noise(.12,.35,5000);tone(2200,1500,.2,'triangle',.1,.05)},
 rapier:()=>{noise(.15,.25,6000);tone(2600,1800,.4,'sine',.1,.05)},
 star:()=>{tone(900,1900,.25,'sine',.2);noise(.2,.2,6000)},
 axe:()=>{noise(.25,.4,900);tone(150,60,.25,'sawtooth',.2,.1)},
 club:()=>{noise(.15,.3,400);tone(90,40,.3,'square',.25,.1)},
 hammer:()=>{noise(.2,.3,300);tone(70,35,.4,'square',.3,.12)},
 spear:()=>{noise(.18,.35,2500);tone(500,1200,.15,'sawtooth',.12)},
 bow:()=>{tone(300,150,.15,'triangle',.3);tone(1200,400,.2,'sine',.1,.05)},
 staff:()=>{tone(500,1500,.3,'sawtooth',.15);tone(250,750,.3,'sine',.2)},
 claw:()=>{noise(.2,.3,700);tone(160,70,.25,'sawtooth',.2)}};
S.beep=k=>k===2?tone(880,1400,.45,'square',.22):tone(520,520,.18,'square',.2);
S.laugh=()=>{if(mute)return;try{const c=ac(),n=c.currentTime;for(let i=0;i<4;i++){const t0=n+i*.15,o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(330-i*18,t0);o.frequency.linearRampToValueAtTime(250-i*18,t0+.11);f.type='bandpass';f.frequency.value=950;f.Q.value=2.5;g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(.6,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+.12);o.connect(f);f.connect(g);g.connect(mg);o.start(t0);o.stop(t0+.13)}}catch(e){}};
S.sw=w=>(SW[w]||SW.claw)();
const NT=[110,130.8,164.8,130.8,98,123.5,146.8,123.5];
function music(){clearInterval(mi);if(mute)return;mi=setInterval(()=>{const f=NT[ni%8];tone(f,f*.99,.9,'triangle',.06);if(ni%2===0)tone(f*4,f*4,.4,'sine',.02);ni++},500)}
$('mu').onclick=()=>{mute=!mute;$('mu').textContent=mute?'🔇':'🔊';mute?clearInterval(mi):(ac(),music())};

/* ===== CANVAS ===== */
// Otimizações: canvas opaco, resolução limitada (~1 milhão de pixels), fundo em cache e 60 FPS no máximo.
const cv=$('cv');let ctx=cv.getContext('2d',{alpha:false}),w=300,h=200,dpr=1,bgc=null,bgk='';
function rs(){
  const r=cv.getBoundingClientRect();
  w=Math.max(1,r.width);h=Math.max(1,r.height);
  dpr=Math.max(1,Math.min(window.devicePixelRatio||1,2,Math.sqrt(1000000/(w*h))));
  const nw=Math.round(w*dpr),nh=Math.round(h*dpr);
  if(cv.width!==nw||cv.height!==nh){cv.width=nw;cv.height=nh;bgk=''}
}
window.addEventListener('resize',rs);if(window.ResizeObserver)new ResizeObserver(rs).observe(cv);rs();
const P=()=>({hx:w*.24,ex:w*.76,gy:h*.78,sz:Math.min(w*.27,h*.43)});
function burst(who,c,n){const p=P(),x=who==='h'?p.hx:p.ex,y=p.gy-p.sz*.45;for(let i=0;i<n;i++)ps.push({x,y,vx:(Math.random()-.5)*p.sz*3.4,vy:-Math.random()*p.sz*2.8,l:.7+Math.random()*.4,c,s:(2+Math.random()*3)*p.sz/75})}
function ft(who,t,c){const p=P();fx.push({x:who==='h'?p.hx:p.ex,y:p.gy-p.sz*1.1,t,c,l:1})}
const hpc=r=>r>.35?'#3fb950':'hsl('+Math.round(120*Math.max(0,r)/.35)+',75%,45%)';
function bar(x,y,bw,v,mx,nm,al,fs){const r=Math.max(0,v/mx),bh=fs+8;ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(x,y,bw,bh);ctx.fillStyle=hpc(r);ctx.fillRect(x+2,y+2,(bw-4)*r,bh-4);ctx.textBaseline='alphabetic';ctx.font='700 '+fs+'px '+FN;ctx.fillStyle='#fff';ctx.textAlign=al;ctx.fillText(nm,al==='left'?x:x+bw,y-5);ctx.textAlign='center';ctx.font='700 '+(fs-1)+'px '+FN;ctx.shadowColor='#000';ctx.shadowBlur=3;ctx.fillText(v+'/'+mx,x+bw/2,y+bh-6);ctx.shadowBlur=0}
function spr(em,x,y,sz,a,dir,ph,t,boss){
  ctx.save();
  const off=mvf(a.l>0?1-a.l:-1)*GP(sz)*dir,bob=Math.sin(t/280+ph)*sz*.04;
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(x,y+sz*.05,sz*.45,sz*.1,0,0,7);ctx.fill();

/* ===== CONTA GOOGLE (Firebase Auth) ===== */
function authUI(){
  $('au').classList.toggle('hid',!FBON);$('nm').classList.toggle('hid',FBON);
  $('gl').classList.toggle('hid',!FBON||!!USER);$('ai').classList.toggle('hid',!USER);
  $('nx').classList.toggle('hid',FBON&&!USER);
  if(USER){$('an').textContent='👤 '+$('nm').value;$('ab').textContent='🏅 Seu recorde: '+myBest+' pts'}
}
if(FB.apiKey&&window.firebase){
  try{
    firebase.initializeApp(FB);AU=firebase.auth();FBON=true;
    try{AU.useDeviceLanguage()}catch(e){}
    AU.onAuthStateChanged(async u=>{
      USER=u;myBest=0;
      if(u){
        const n=cn((u.displayName||'').trim().split(/\s+/)[0]||(u.email||'').split('@')[0]);
        $('nm').value=n;try{localStorage.setItem('rpgNm',n)}catch(e){}
        authUI();
        try{const r=await jget('/best/'+u.uid+'.json');if(r&&Number.isFinite(r.s))myBest=r.s}catch(e){}
        flush();
      }else $('nm').value='';
      authUI();if($('menu').classList.contains('on')&&!G)showTop();
    });
  }catch(e){FBON=false}
}

/* ===== RANKING (online + local) ===== */
const MD=['🥇','🥈','🥉'];
const nk=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\p{L}\p{N} _-]/gu,'').trim().slice(0,12);
const dstr=d=>{if(!Number.isFinite(d))return '';try{return new Date(d).toLocaleDateString('pt-BR')}catch(e){return ''}};
const jq=v=>encodeURIComponent(JSON.stringify(v));
async function jget(p){
  const a=new AbortController(),t=setTimeout(()=>a.abort(),9000);
  try{const r=await fetch(DBU+p,{signal:a.signal});if(!r.ok)throw new Error('http '+r.status);return await r.json()}
  finally{clearTimeout(t)}
}
/* Cada conta tem 1 registro em /best/<uid>; só é substituído quando o novo escore é maior. */
async function submit(e){
  if(!DBU||!USER||!(e.s>0))return;
  const u=USER.uid;
  try{
    const tk=await USER.getIdToken(),cur=await jget('/best/'+u+'.json');
    if(cur&&Number.isFinite(cur.s)&&cur.s>=e.s)return;
    const r=await fetch(DBU+'/best/'+u+'.json?auth='+encodeURIComponent(tk),{method:'PUT',body:JSON.stringify({n:e.n,k:nk(e.n),e:e.e,s:e.s,d:{'.sv':'timestamp'}})});
    if(!r.ok&&r.status>=500)throw new Error('http');
  }catch(x){pend.push({n:e.n,e:e.e,s:e.s,u});pend=pend.slice(-5);save()}
}
async function flush(){
  if(!DBU||!USER||!pend.length)return;
  const a=pend.filter(x=>x.u===USER.uid);pend=pend.filter(x=>x.u!==USER.uid);save();
  for(const e of a)await submit(e);
}
function paint(a,o){
  o=o||{};const rl=$('rl');rl.textContent='';
  const note=t=>{const n=document.createElement('div');n.className='rn';n.textContent=t;rl.appendChild(n)};
  if(o.note)note(o.note);
  if(!a.length){note(o.empty||'Nenhum recorde ainda');return}
  const mine=nk($('nm').value);
  a.forEach((q,i)=>{
    const d=document.createElement('div'),x=document.createElement('span'),b=document.createElement('b'),c=document.createElement('small');
    d.className='rr'+((USER&&q.u?q.u===USER.uid:(q.k||nk(q.n))===mine)?' me':'')+(o.click?' cl':'');
    x.textContent=(MD[i]||(i+1)+'.')+' '+q.n+' '+q.e;b.textContent=q.s+' pts';c.textContent=dstr(q.d);
    d.append(x,b,c);
    if(o.click)d.onclick=()=>{$('sq').value=q.n;search()};
    rl.appendChild(d);
  });
}
async function showTop(){
  const id=++RQ;
  if(!DBU){
    $('rt').textContent='🏆 MELHORES PONTUAÇÕES';
    paint(rank.slice(0,10),{note:'Ranking online desligado: mostrando só os recordes deste aparelho.'});return;
  }
  $('rt').textContent='🏆 TOP 10 • ONLINE';$('rl').textContent='Carregando ranking...';
  try{
    const j=await jget('/best.json?orderBy=%22s%22&limitToLast=100');
    if(id!==RQ)return;
    TOP=Object.entries(j||{}).filter(([,x])=>okE(x)).map(([u,x])=>{x.u=u;x.k=x.k||nk(x.n);return x}).sort((a,b)=>b.s-a.s);
    paint(TOP.slice(0,10),{empty:'Ainda não há pontuações. Seja o primeiro!'});
  }catch(e){
    if(id!==RQ)return;
    paint(rank.slice(0,10),{note:'⚠️ Sem conexão com o ranking online. Mostrando só os seus recordes neste aparelho.'});
  }
}
async function search(){
  const q=nk($('sq').value);if(!q){showTop();return}
  if(!DBU){$('rt').textContent='🔍 BUSCA (neste aparelho)';paint(rank.filter(x=>nk(x.n).startsWith(q)),{empty:'Nada encontrado neste aparelho.'});return}
  const id=++RQ;$('rt').textContent='🔍 BUSCANDO...';$('rl').textContent='Carregando...';
  try{
    const j=await jget('/best.json?orderBy=%22k%22&startAt='+jq(q)+'&endAt='+jq(q+'\uf8ff')+'&limitToFirst=300');
    if(id!==RQ)return;
    const l=Object.entries(j||{}).filter(([,x])=>okE(x)).map(([u,x])=>{x.u=u;x.k=x.k||nk(x.n);return x}).sort((a,b)=>b.s-a.s);
    if(!l.length){$('rt').textContent='🔍 NENHUM JOGADOR';paint([],{empty:'Nenhum jogador com esse nome.'});return}
    const ex=l.filter(x=>x.k===q);
    if(ex.length){
      const pos=TOP.findIndex(x=>x.u===ex[0].u);
      $('rt').textContent='👤 '+ex[0].n.toUpperCase()+' • RECORDE';
      paint(ex.slice(0,10),{note:pos>=0?'Posição no ranking geral: #'+(pos+1):''});
    }else{
      $('rt').textContent='🔍 JOGADORES ENCONTRADOS';
      paint(l.slice(0,10),{click:1});
    }
  }catch(e){
    if(id!==RQ)return;
    $('rt').textContent='🔍 BUSCA';paint([],{empty:'⚠️ Não foi possível buscar agora. Tente de novo.'});
  }
}

/* ===== COMBATE ===== */
function cdown(cb){
  let n=3;CDN={t:'3',l:0};S.beep(1);
  CI=setInterval(()=>{
    n--;
    if(n>0){CDN={t:''+n,l:0};S.beep(1)}
    else{clearInterval(CI);CDN={t:'LUTE!',l:0,x:1};S.beep(2);cb()}
  },1000);
}
function next(){
  const d=EN[G.r-1];
  const hp=Math.round(d[2]*DHP);E={n:d[0],e:d[1],hp,mx:hp,a:Math.round(d[3]*DDM),b:!!d[4],t:0};
  A={h:{l:0,f:0,d:0,p:0},e:{l:0,f:0,d:0,p:0},sh:0};
  G.def=0;busy=0;ID=IDLE;
  const intro=()=>{if(E.b)log('👑 CHEFE! Golpe pesado a cada 3 turnos')};
  TM=30;live=0;busy=1;ui();
  const begin=d=>{
    live=1;const ef=Math.random()<.5;
    setTimeout(()=>{if(!live)return;log(ef?'⚡ Sala '+G.r+' • '+E.n+' ataca primeiro!':'🎲 Sala '+G.r+' • Você ataca primeiro!');intro()},d);
    if(ef){busy=1;setTimeout(()=>{if(live)foe()},d+1100)}else busy=0;
    ui();
  };
  if(G.r===1)cdown(()=>begin(950));else begin(0);
}
function strike(m,fc,n,after){
  let tot=0;
  for(let i=0;i<n;i++)setTimeout(()=>{
    A.h.l=1;const f=G.h.f;S.sw(f.w);
    if(['bow','staff','star'].includes(f.w))pj.push({c:f.glow||'#e8d9a0',a:f.w==='bow',t:0});
    setTimeout(()=>{
    if(!fc&&Math.random()<.07){if(PV)PV.hits.push({m:1});else{ft('e','Esquivou!','#9cf');S.laugh()}}
    else{
      let d=Math.round(G.a*m*(.85+Math.random()*.3));const c=fc||Math.random()<.15;
      if(c)d=Math.round(d*1.8);
      tot+=d;if(PV)PV.hits.push({d,c});else{E.hp=Math.max(0,E.hp-d);A.e.f=1;A.sh=c?12:5;
      burst('e',c?'#ffd23f':'#ff5a5a',c?24:12);ft('e',(c?'💥':'')+d,c?'#ffd23f':'#fff');c?S.crit():S.hit()}
    }
    if(i===n-1){if(!PV)log('🗡️ '+G.n+' causou '+tot+' de dano em '+E.n+'.');if(after)after(tot)}
    },260);
  },i*220+120);
}
function healFx(v){const o=G.hp;G.hp=Math.min(G.mx,G.hp+v);if(G.hp>o){ft('h','+'+(G.hp-o),'#4ade80');burst('h','#4ade80',10);S.heal()}}
function end(ms){setTimeout(()=>{
  if(!live)return;
  if(PV){send({t:'act',k:PV.k,h:PV.hits,s:me()});PV.hits=[];PV.my=0;return}
  if(E.hp<=0)win();else foe()},ms)}
function act(t){
  if(busy||!G||G.hp<=0||E.hp<=0)return;
  if(t===1&&G.cd>0){log('⏳ Habilidade recarregando ('+G.cd+')');S.miss();return}
  if(t===2&&G.dc>0){S.miss();return}
  if(t===3&&G.k<1){log('❌ Sem Kit Médico!');S.miss();return}
  busy=1;ID=IDLE;ui();const s=G.h.s;if(PV)PV.k=t;
  if(t===0){strike(1,0,1);end(900)}
  else if(t===1){
    G.cd=s.cd+1;S.skill();const n=s.h||1;
    strike(s.m*G.sm,!!s.c,n,tot=>{if(s.l)healFx(Math.round(tot*.7));if(s.hl)healFx(s.hl)});
    end(n*220+800);
  }else if(t===2){G.def=1;G.dc=3;log('🛡️ '+G.n+' ergue o escudo: bloqueia o próximo golpe!');S.click();ft('h','🛡️','#58a6ff');end(600)}
  else{G.k--;log('🧪 Kit Médico usado!');healFx(65);end(700)}
}
/* Anti-"ficar parado": se o jogador não reagir em IDLE segundos, o inimigo ataca (solo)
   ou o jogador perde a vez (online). */
function idleHit(){
  if(PV){
    busy=1;PV.my=0;ui();log('⏰ Você demorou! Perdeu a vez.');S.miss();ft('h','⏰','#ffb347');
    send({t:'pass'});return;
  }
  busy=1;ui();log('⏰ Reaja! '+E.n+' aproveitou e atacou!');foe();
}
function foe(){
  E.t++;A.e.l=1;S.sw((ES[E.n]||{}).w||'claw');
  setTimeout(()=>{
    if(!live)return;
    const heavy=E.b&&E.t%3===0;
    let d=Math.round(E.a*(heavy?1.7:1)*(.85+Math.random()*.3));const cr=!heavy&&Math.random()<.12;if(cr)d=Math.round(d*1.5);
    const gd=G.def>0;
    if(!heavy&&Math.random()<.07){ft('h','Esquivou!','#9cf');S.laugh();log('💨 Você esquivou do ataque de '+E.n+'!')}
    else if(gd){G.def--;ft('h','🛡️ Bloqueou!','#58a6ff');burst('h','#58a6ff',14);S.click();A.sh=3;log('🛡️ O escudo bloqueou o golpe de '+E.n+'! Restam '+G.def+' proteção(ões).')}
    else{G.hp=Math.max(0,G.hp-d);A.h.f=1;A.sh=heavy?14:6;burst('h','#ff5a5a',12);ft('h',(cr?'💥-':'-')+d,'#ff7b7b');S.hurt();log((heavy?'💢 Golpe pesado! ':'💥 ')+E.n+' causou '+d+' de dano.')}
    if(G.cd>0)G.cd--;if(G.dc>0)G.dc--;
    if(G.hp<=0){A.h.d=1+(Math.random()<.5|0);A.e.v=1;setTimeout(()=>log('💀 Você foi derrotado...'),2200);return fin(0)}
    if(E.b&&(E.t+1)%3===0)log('⚠️ '+E.n+' carrega um golpe pesado! Defenda!');
    busy=0;ID=IDLE;ui();
  },360);
}
function win(){
  live=0;A.e.d=1+(Math.random()<.5|0);A.h.v=1;S.win();G.sc+=100*G.r+G.hp*2;busy=1;setTimeout(()=>log('🏆 '+E.n+' derrotado!'),2200);ui();
  setTimeout(()=>{
    if(G.r>=10)return fin(1);
    G.hp=Math.min(G.mx,G.hp+Math.round(G.mx*.2));if(E.b)G.k++;
    showBuff();
  },4600);
}
function showBuff(){
  const P2=[['⚔️ +15% de ataque',()=>{G.a=Math.round(G.a*1.15)}],['❤️ +25 de vida máxima',()=>{G.mx+=25;G.hp=Math.min(G.mx,G.hp+25)}],['🧪 +1 Kit Médico',()=>{G.k++}],['🔮 Habilidade +20% de dano',()=>{G.sm*=1.2}]].sort(()=>Math.random()-.5).slice(0,3);
  const o=$('bo');o.textContent='';
  P2.forEach(p=>{const b=document.createElement('button');b.className='b g';b.textContent=p[0];b.onclick=()=>{p[1]();$('buff').classList.remove('on');S.heal();G.r++;next()};o.appendChild(b)});
  $('buff').classList.add('on');
}
function fin(v){
  live=0;busy=1;const s=G.sc+(v?1000:0);
  if(!v)S.lose();
  if(s>0){
    rank.push({n:G.n,e:G.h.e,s,d:Date.now()});rank.sort((a,b)=>b.s-a.s);rank=rank.slice(0,10);
    SUBP=submit({n:G.n,e:G.h.e,s}); // envia para o ranking online (só substitui se for recorde da conta)
  }
  let m=v?'🏆 Vitória! '+s+' pontos.':'💀 Derrotado na sala '+G.r+'. '+s+' pontos.';
  if(USER&&s>myBest){myBest=s;m+=' 🏅 Novo recorde pessoal!'}
  if(v&&lvl<6){lvl++;m+=' Nível de conta '+lvl+': +5% de vida e ataque!'}
  save();
  setTimeout(()=>{$('msg').textContent=m;menu()},4800);
}

function timeUp(){
  if(!live)return;
  const a=G.hp/G.mx,b=E.hp/E.mx;
  if(PV){if(PV.host){const w=a>=b?'h':'g';send({t:'end',w});pvFin(w==='h')}return}
  live=0;busy=1;ui();
  if(a>=b){log('⏱️ Tempo esgotado! Você tem mais vida e vence a sala!');win()}
  else{log('⏱️ Tempo esgotado! '+E.n+' tem mais vida...');A.h.d=1+(Math.random()<.5|0);A.e.v=1;fin(0)}
}
/* ===== ONLINE (PeerJS, 2 jogadores) ===== */
const cn=v=>String(v||'').replace(/[^\p{L}\p{N} _-]/gu,'').trim().slice(0,12)||'Herói';
const num=(v,a,b)=>Number.isFinite(v)?Math.min(b,Math.max(a,v)):a;
const me=()=>({hp:G.hp,mx:G.mx,def:G.def});
const rc=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let r='';for(let i=0;i<5;i++)r+=a[Math.floor(Math.random()*a.length)];return r};
function send(m){try{PV.c.send(m)}catch(e){}}
let NR=0,CT=null,netv=0;
const PO={config:{iceServers:ICE}};
const NM={'peer-unavailable':'Sala não encontrada. Confira o código.','network':'Sem conexão com o servidor. Verifique sua internet.','server-error':'O servidor de conexão está com problema. Tente de novo em instantes.','socket-error':'Falha na conexão com o servidor.','socket-closed':'A conexão com o servidor caiu.','webrtc':'A conexão direta foi bloqueada pela rede. Tente outra rede (ex.: 4G).','browser-incompatible':'Este navegador não suporta o modo online.'};
function netView(v){
  netv=v;['n0','n1','n2'].forEach((id,i)=>$(id).classList.toggle('hid',i!==v));
  $('sw').classList.add('hid');$('cb').classList.add('hid');$('cp').classList.add('hid');
  $('jn').disabled=false;$('nb').textContent=v?'CANCELAR':'VOLTAR';
}
function nst(m,sp,er){$('sw').classList.remove('hid');$('ns').textContent=m;$('ns').style.color=er?'#ff7b7b':'#9fb0c0';$('sp').classList.toggle('hid',!sp)}
function arm(ms,m){clearTimeout(CT);CT=setTimeout(()=>nfail(m),ms)}
function nfail(m){clearTimeout(CT);closeNet();nst('❌ '+m,0,1);$('jn').disabled=false;$('cb').classList.add('hid');$('cp').classList.add('hid')}
function closeNet(){clearTimeout(CT);const c=PV&&PV.c,p=PR;PV=null;PR=null;try{c&&c.close()}catch(e){}try{p&&p.destroy()}catch(e){}}
function hostWait(){$('cb').classList.remove('hid');$('cp').classList.remove('hid');nst('Sala criada! Aguardando o outro jogador...',1)}
function netStart(host,code){
  if(!window.Peer){nfail('Não foi possível carregar o serviço online. Verifique a internet e recarregue a página.');return}
  nst(host?'Criando sala...':'Conectando ao servidor...',1);
  arm(15000,'O servidor de conexão não respondeu. Tente novamente.');
  let pr;
  try{pr=PR=host?new Peer('ninjaquest-'+code,PO):new Peer(PO)}catch(e){nfail('Erro ao iniciar a conexão.');return}
  pr.on('error',e=>{
    if(pr!==PR)return;
    if(host&&e.type==='unavailable-id'&&NR++<4){closeNet();netStart(true,rc());return}
    nfail(NM[e.type]||'Erro de conexão ('+(e.type||'?')+').');
  });
  pr.on('disconnected',()=>{if(pr===PR&&!pr.destroyed){try{pr.reconnect()}catch(e){}}});
  if(host){
    pr.on('open',()=>{clearTimeout(CT);NR=0;$('cc').textContent=code;$('cp').textContent='📋 COPIAR CÓDIGO';hostWait()});
    pr.on('connection',c=>{if(pr!==PR||PV){c.close();return}pvSetup(c,true)});
  }else pr.on('open',()=>{
    clearTimeout(CT);nst('Entrando na sala '+code+'...',1);
    arm(30000,'Não foi possível entrar na sala. Confira o código e tente de novo.');
    pvSetup(pr.connect('ninjaquest-'+code,{reliable:true}),false);
  });
}
function pvSetup(c,host){
  PV={c,host,my:0,hits:[],o:null,k:0};
  let TO=null;
  const drop=m=>{
    if(!(PV&&PV.c===c&&!G))return;
    clearTimeout(TO);try{c.close()}catch(e){}PV=null;
    if(host)hostWait();else nfail(m);
  };
  TO=setTimeout(()=>drop('Não foi possível conectar com o outro jogador. A rede pode estar bloqueando; tente novamente.'),20000);
  c.on('open',()=>{
    clearTimeout(TO);
    if(host){$('cb').classList.add('hid');$('cp').classList.add('hid');nst('Jogador conectado! Iniciando...',1)}
    else{nst('Conectado! Iniciando...',1);arm(12000,'A sala não respondeu. Tente novamente.');send({t:'hi',n:cn($('nm').value),h:sel})}
  });
  c.on('data',onData);
  c.on('error',()=>drop('Erro na conexão com o outro jogador.'));
  c.on('close',()=>{
    if(PV&&PV.c===c&&live){live=0;busy=1;log('📴 O outro jogador saiu.');setTimeout(()=>{$('msg').textContent='📴 O outro jogador saiu.';closeNet();menu()},1500)}
    else drop('A sala foi fechada.');
  });
}
function onData(m){
  if(!m||typeof m!=='object'||!PV)return;
  if(m.t==='hi'&&PV.host&&!G){PV.o={n:cn(m.n),h:num(m.h,0,H.length-1)|0};const f=Math.random()<.5?'h':'g',th=pickTh();send({t:'go',f,th,n:cn($('nm').value),h:sel});startPv(f==='h',th)}
  else if(m.t==='go'&&!PV.host&&!G){PV.o={n:cn(m.n),h:num(m.h,0,H.length-1)|0};startPv(m.f==='g',num(m.th,0,TH.length-1)|0)}
  else if(m.t==='act'&&G&&live)oppAct(m);
  else if(m.t==='pass'&&G&&live){ // o oponente demorou: você ganha a vez
    ID=IDLE;PV.my=1;busy=0;ft('e','⏰ Demorou!','#ffb347');log('🎯 Sua vez! O oponente demorou.');ui();
  }
  else if(m.t==='st'&&G&&live){
    if(m.dg){ft('e','Esquivou!','#9cf');S.laugh()}const s=m.s||{},oh=E.hp,od=E.def;E.hp=num(s.hp,0,999);E.mx=num(s.mx,1,999);E.def=num(s.def,0,2);
    if(E.hp<oh){A.e.f=1;A.sh=6;burst('e','#ff5a5a',14);ft('e','-'+(oh-E.hp),'#fff');S.hit()}
    else if(E.def<od){ft('e','🛡️ Bloqueou!','#58a6ff');burst('e','#58a6ff',14);S.click()}
    if(E.hp<=0)pvFin(true);
  }
  else if(m.t==='end'&&live)pvFin(m.w===(PV.host?'h':'g'));
}
function startPv(first,th){
  clearTimeout(CT);
  const x=H[sel],o=PV.o,oh=H[o.h];
  G={n:cn($('nm').value),h:x,hp:x.hp,mx:x.hp,a:x.a,k:3,cd:0,def:0,sm:1,sc:0,r:1,th:th|0};
  E={n:o.n,e:oh.e,hp:oh.hp,mx:oh.hp,a:oh.a,b:0,t:0,f:oh.f,def:0};
  A={h:{l:0,f:0,d:0,p:0},e:{l:0,f:0,d:0,p:0},sh:0};ps=[];fx=[];pj=[];L=[];
  ['menu','pick','net','buff'].forEach(i=>$(i).classList.remove('on'));
  TM=30;live=0;busy=1;ID=IDLE;PV.my=first;ui();music();
  cdown(()=>{live=1;busy=first?0:1;ID=IDLE;ui();setTimeout(()=>{if(live)log(first?'🎲 Você começa!':'🎲 '+o.n+' começa!')},950)});
}
function oppAct(m){let dg=0;
  const s=m.s||{},k=num(m.k,0,3)|0,f=E.f,hits=(Array.isArray(m.h)?m.h:[]).slice(0,3),oh=E.hp;
  E.hp=num(s.hp,0,999);E.mx=num(s.mx,1,999);E.def=num(s.def,0,2);
  if(E.hp>oh){ft('e','+'+(E.hp-oh),'#4ade80');S.heal()}
  if(k<2){A.e.l=1;S.sw(f.w);if(['bow','staff','star'].includes(f.w))pj.push({c:f.glow||'#e8d9a0',a:f.w==='bow',t:0,r:1})}
  hits.forEach((h,i)=>setTimeout(()=>{
    if(!live||!h||typeof h!=='object')return;
    if(h.m){dg=1;ft('h','Esquivou!','#9cf');S.laugh();return}
    const d=num(h.d,0,400)|0;
    if(G.def>0){G.def--;ft('h','🛡️ Bloqueou!','#58a6ff');burst('h','#58a6ff',14);S.click();A.sh=3}
    else{G.hp=Math.max(0,G.hp-d);A.h.f=1;A.sh=h.c?12:6;burst('h','#ff5a5a',14);ft('h','-'+d,'#ff7b7b');S.hurt()}
  },260+i*220));
  setTimeout(()=>{
    if(!live)return;
    send({t:'st',s:me(),dg});
    if(G.hp<=0){A.h.d=1+(Math.random()<.5|0);pvFin(false);return}
    if(G.cd>0)G.cd--;if(G.dc>0)G.dc--;
    PV.my=1;busy=0;ID=IDLE;log('🎯 Sua vez!');ui();
  },260+hits.length*220+450);
}
function pvFin(v){
  if(!live)return;live=0;busy=1;
  if(v){A.e.d=1+(Math.random()<.5|0);A.h.v=1;S.win();setTimeout(()=>log('🏆 Você venceu o duelo!'),2200)}
  else{A.h.d=1+(Math.random()<.5|0);A.e.v=1;S.lose();setTimeout(()=>log('💀 Você perdeu o duelo...'),2200)}
  const t=v?'🏆 Você venceu o duelo online!':'💀 Você perdeu o duelo online.';
  setTimeout(()=>{$('msg').textContent=t;closeNet();menu()},5200);
}
/* ===== EVENTOS ===== */
['b0','b1','b2','b3'].forEach((id,i)=>{$(id).onclick=()=>act(i)});
$('ol').onclick=()=>{S.click();$('pick').classList.remove('on');netView(0);$('net').classList.add('on')};
$('nb').onclick=()=>{
  S.click();closeNet();
  if(netv===0){$('net').classList.remove('on');$('pick').classList.add('on')}else netView(0);
};
$('mk').onclick=()=>{ac();closeNet();NR=0;netView(1);netStart(true,rc())};
$('jn0').onclick=()=>{S.click();closeNet();netView(2);$('cd').value='';try{$('cd').focus()}catch(e){}};
$('jn').onclick=()=>{
  ac();const c=$('cd').value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
  if(c.length<5){nst('Digite o código de 5 caracteres.',0,1);return}
  closeNet();$('jn').disabled=true;netStart(false,c);
};
$('cd').addEventListener('keydown',e=>{if(e.key==='Enter')$('jn').click()});
$('cp').onclick=()=>{
  const c=$('cc').textContent;
  const ok=()=>{$('cp').textContent='✅ COPIADO!';setTimeout(()=>{$('cp').textContent='📋 COPIAR CÓDIGO'},1800)};
  try{navigator.clipboard.writeText(c).then(ok,()=>{})}catch(e){}
};
$('gl').onclick=async()=>{
  if(!AU)return;S.click();
  const pv=new firebase.auth.GoogleAuthProvider();pv.setCustomParameters({prompt:'select_account'});
  try{await AU.signInWithPopup(pv)}
  catch(e){
    const c=e&&e.code;
    if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'||c==='auth/web-storage-unsupported'){try{await AU.signInWithRedirect(pv)}catch(x){}}
    else if(c!=='auth/popup-closed-by-user'&&c!=='auth/cancelled-popup-request'){
      $('msg').textContent=c==='auth/unauthorized-domain'?'⚠️ Este site ainda não foi autorizado no Firebase (Authentication > Configurações > Domínios autorizados).':'⚠️ Não foi possível entrar com o Google ('+(c||'erro')+').';
    }
  }
};
$('lo').onclick=()=>{S.click();if(AU)AU.signOut()};
$('nm').addEventListener('input',()=>$('nm').classList.remove('err'));
$('nx').onclick=()=>{
  const nm=$('nm');
  if(FBON&&!USER){$('msg').textContent='⚠️ Entre com sua conta Google para continuar!';S.miss();return}
  if(!nm.value.replace(/[^\p{L}\p{N} _-]/gu,'').trim()){
    $('msg').textContent='⚠️ Digite seu nome para continuar!';nm.classList.remove('err');void nm.offsetWidth;nm.classList.add('err');nm.focus();S.miss();return;
  }
  try{localStorage.setItem('rpgNm',cn(nm.value))}catch(e){}
  ac();S.click();$('menu').classList.remove('on');pickui();$('pick').classList.add('on')};
$('go').onclick=()=>{
  ac();S.click();
  const bn=1+.05*(lvl-1),n=$('nm').value.replace(/[^\p{L}\p{N} _-]/gu,'').trim().slice(0,12)||'Herói',x=H[sel];
  G={n,h:x,hp:Math.round(x.hp*bn),mx:Math.round(x.hp*bn),a:Math.round(x.a*bn),k:3,cd:0,def:0,sm:1,sc:0,r:1,th:pickTh()};
  ps=[];fx=[];L=[];$('pick').classList.remove('on');next();music();
};
$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')$('nx').click()});
$('sf').addEventListener('submit',e=>{e.preventDefault();search()});
$('stp').onclick=()=>{$('sq').value='';showTop()};
document.addEventListener('keydown',e=>{
  if($('menu').classList.contains('on')||$('pick').classList.contains('on')||$('buff').classList.contains('on')||$('net').classList.contains('on'))return;
  if(/^[1-4]$/.test(e.key))act(+e.key-1);
});
try{if(!FBON)$('nm').value=localStorage.getItem('rpgNm')||''}catch(e){}
menu();flush();
})();
</script>
