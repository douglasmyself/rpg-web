<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Dungeon Quest - O Sobrevivente</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #090d16 0%, #151b2b 100%);
      color: #e6edf3;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .game-container {
      background-color: #1a2234;
      border: 2px solid #30363d;
      border-radius: 12px;
      width: 100%;
      max-width: 550px;
      padding: 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-header {
      text-align: center;
      margin-bottom: 15px;
    }

    .game-header h1 {
      font-size: 20px;
      color: #00ff66;
      letter-spacing: 1px;
    }

    /* Painel de Status Estilo Cards */
    .status-panels {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-bottom: 15px;
    }

    .status-card {
      flex: 1;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .status-card h3 {
      font-size: 14px;
      color: #f0b429;
      margin-bottom: 4px;
    }

    .status-line {
      font-size: 13px;
      color: #c9d1d9;
    }

    /* Consola de Texto */
    .output {
      width: 100%;
      height: 220px;
      overflow-y: auto;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      line-height: 1.4;
      color: #7ee787;
      margin-bottom: 15px;
    }

    /* Botões de Ação Diretos */
    .action-controls {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .btn-action {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-attack {
      background-color: #238636;
      color: #ffffff;
    }

    .btn-attack:hover {
      background-color: #2ea043;
    }

    .btn-potion {
      background-color: #f0b429;
      color: #0d1117;
    }

    .btn-potion:hover {
      background-color: #d49a1d;
    }

    .btn-action:disabled {
      background-color: #21262d;
      color: #484f58;
      cursor: not-allowed;
    }

    /* Campo de Texto para Nome / Classe Inicial */
    .input-group {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .input-group input {
      flex: 1;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #ffffff;
      padding: 10px;
      font-size: 14px;
    }

    .input-group button {
      background-color: #238636;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="game-header">
    <h1>⚔️ O SOBREVIVENTE ⚔️</h1>
  </div>

  <!-- Cards de Status do Herói e Inimigo -->
  <div class="status-panels" id="statusPanels" style="display: none;">
    <div class="status-card">
      <h3 id="cardHeroTitle">Herói</h3>
      <div class="status-line" id="cardHeroClass">Classe: -</div>
      <div class="status-line" id="cardHeroHp">Vida: 0/0</div>
      <div class="status-line" id="cardHeroPotion">Kit Médico: 0</div>
    </div>
    <div class="status-card">
      <h3 id="cardEnemyTitle">Inimigo</h3>
      <div class="status-line" id="cardEnemyHp">Vida: 0</div>
    </div>
  </div>

  <!-- Ecrã de Registo -->
  <div id="output" class="output"></div>

  <!-- Botões de Ação na Batalha -->
  <div class="action-controls" id="battleControls" style="display: none;">
    <button class="btn-action btn-attack" onclick="acaoAtacar()">Atacar</button>
    <button class="btn-action btn-potion" onclick="acaoPocao()">Usar Kit Médico</button>
  </div>

  <!-- Caixa de Input para o Nome / Escolhas numéricas -->
  <div class="input-group" id="inputGroup">
    <input type="text" id="input" placeholder="Digite aqui..." autofocus>
    <button onclick="processarEntrada()">Enviar</button>
  </div>
</div>

<script>
  class Personagem {
    constructor(nome, classe, hp, ataque, pocoes) {
      this.nome = nome;
      this.classe = classe;
      this.hp = hp;
      this.hp_maximo = hp;
      this.ataque = ataque;
      this.pocoes = pocoes;
    }
    esta_vivo() { return this.hp > 0; }
    usar_pocao() {
      if (this.pocoes > 0) {
        let cura = 65;
        this.hp = Math.min(this.hp_maximo, this.hp + cura);
        this.pocoes -= 1;
        imprimir(`\n🧪 ${this.nome} usou um Kit Médico e recuperou ${cura} de Vida!`);
        imprimir(`Kit Médico restantes: ${this.pocoes}`);
      } else {
        imprimir("\n❌ Você não tem mais nenhum Kit Médico!");
      }
    }
  }

  class Inimigo {
    constructor(nome, hp, ataque, experiencia) {
      this.nome = nome;
      this.hp = hp;
      this.ataque = ataque;
      this.experiencia = experiencia;
    }
    esta_vivo() { return this.hp > 0; }
  }

  const outputDiv = document.getElementById("output");
  const inputElem = document.getElementById("input");
  const inputGroup = document.getElementById("inputGroup");
  const battleControls = document.getElementById("battleControls");
  const statusPanels = document.getElementById("statusPanels");

  let estado = "AGUARDANDO_NOME";
  let heroi = null;
  let nomeHeroi = "";
  let faseAtual = 0;
  const totalFases = 3;
  let inimigoAtual = null;

  const catalogo_inimigos = [
    { nome: "Ladrão", hp: 50, ataque: 12, exp: 20 },
    { nome: "Trapaceiro", hp: 80, ataque: 18, exp: 40 },
    { nome: "Goblin Espectral", hp: 60, ataque: 15, exp: 30 },
    { nome: "Orc Guerreiro", hp: 90, ataque: 22, exp: 60 },
    { nome: "Esqueleto Guerreiro", hp: 70, ataque: 16, exp: 35 },
    { nome: "Assassino das Sombras", hp: 85, ataque: 20, exp: 50 },
    { nome: "Dragão das Sombras (Chefe)", hp: 110, ataque: 28, exp: 100 }
  ];

  function imprimir(texto) {
    outputDiv.textContent += texto + "\n";
    outputDiv.scrollTop = outputDiv.scrollHeight;
    atualizarPaineis();
  }

  function atualizarPaineis() {
    if (heroi && inimigoAtual && estado === "COMBATE") {
      statusPanels.style.display = "flex";
      battleControls.style.display = "flex";
      inputGroup.style.display = "none";

      document.getElementById("cardHeroTitle").textContent = heroi.nome;
      document.getElementById("cardHeroClass").textContent = `Classe: ${heroi.classe}`;
      document.getElementById("cardHeroHp").textContent = `Vida: ${heroi.hp}/${heroi.hp_maximo}`;
      document.getElementById("cardHeroPotion").textContent = `Kit Médico: ${heroi.pocoes}`;

      document.getElementById("cardEnemyTitle").textContent = inimigoAtual.nome;
      document.getElementById("cardEnemyHp").textContent = `Vida: ${inimigoAtual.hp}`;
    } else {
      statusPanels.style.display = "none";
      battleControls.style.display = "none";
      inputGroup.style.display = "flex";
    }
  }

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function iniciarJogo() {
    imprimir("========================================");
    imprimir("        ⚔️ O SOBREVIVENTE ⚔️");
    imprimir("========================================");
    imprimir("Digite o nome do seu herói: ");
  }

  function proximaSala() {
    faseAtual++;
    if (faseAtual > totalFases) {
      statusPanels.style.display = "none";
      battleControls.style.display = "none";
      imprimir("\n========================================");
      imprimir(`🏆 PARABÉNS🏆 ${heroi.nome}! VOCÊ ZEROU A MASMORRA!`);
      imprimir("========================================");
      estado = "FIM";
      return;
    }

    imprimir(`\n----------------------------------------`);
    imprimir(`🚪 Entrando na Sala ${faseAtual}...`);
    
    let dadosAleatorios = catalogo_inimigos[Math.floor(Math.random() * catalogo_inimigos.length)];
    inimigoAtual = new Inimigo(dadosAleatorios.nome, dadosAleatorios.hp, dadosAleatorios.ataque, dadosAleatorios.exp);
    
    imprimir(`⚠️ Um ${inimigoAtual.nome} selvagem apareceu para o combate!`);
    estado = "COMBATE";
    atualizarPaineis();
  }

  function processarEntrada() {
    let valor = inputElem.value.trim();
    inputElem.value = "";
    if (estado === "FIM") return;

    if (estado === "AGUARDANDO_NOME") {
      if (!valor) return;
      nomeHeroi = valor;
      imprimir(valor);
      imprimir("\nEscolha a sua Classe:");
      imprimir("1. Guerreiro (Mais Vida, ataque equilibrado)");
      imprimir("2. Mago (Ataque mais forte, menos Vida)");
      imprimir("Opção (1 ou 2): ");
      estado = "AGUARDANDO_CLASSE";
    } 
    else if (estado === "AGUARDANDO_CLASSE") {
      imprimir(valor);
      if (valor === "2") {
        heroi = new Personagem(nomeHeroi, "Mago", 100, 25, 3);
      } else {
        heroi = new Personagem(nomeHeroi, "Guerreiro", 140, 18, 2);
      }
      imprimir(`\n✨ ${heroi.nome} o Seu ${heroi.classe} entrou na Masmorra com ${heroi.hp} de Vida e ${heroi.pocoes} Kits Médico!`);
      faseAtual = 0;
      proximaSala();
    }
  }

  function acaoAtacar() {
    if (estado !== "COMBATE") return;
    let dano_causado = randomInt(heroi.ataque - 5, heroi.ataque + 5);
    inimigoAtual.hp -= dano_causado;
    imprimir(`\n🗡️ Você atacou o ${inimigoAtual.nome} e causou ${dano_causado} de dano!`);

    if (inimigoAtual.esta_vivo()) {
      let dano_recebido = randomInt(inimigoAtual.ataque - 3, inimigoAtual.ataque + 3);
      heroi.hp -= dano_recebido;
      imprimir(`💥 O ${inimigoAtual.nome} revidou e te causou ${dano_recebido} de dano!`);
    } else {
      imprimir(`\n🏆 Vitória!🏆 Você derrotou o ${inimigoAtual.nome}!`);
      imprimir(`🎉 Sala ${faseAtual} superada com sucesso!`);
      proximaSala();
      return;
    }

    if (!heroi.esta_vivo()) {
      statusPanels.style.display = "none";
      battleControls.style.display = "none";
      imprimir("\n💀 Você foi derrotado na masmorra... Game Over!");
      estado = "FIM";
      return;
    }
    atualizarPaineis();
  }

  function acaoPocao() {
    if (estado !== "COMBATE") return;
    heroi.usar_pocao();
    if (inimigoAtual.esta_vivo()) {
      let dano_recebido = randomInt(inimigoAtual.ataque - 3, inimigoAtual.ataque + 3);
      heroi.hp -= dano_recebido;
      imprimir(`💥 Enquanto você usava o Kit Médico, o ${inimigoAtual.nome} atacou e causou ${dano_recebido} de dano!`);
    }

    if (!heroi.esta_vivo()) {
      statusPanels.style.display = "none";
      battleControls.style.display = "none";
      imprimir("\n💀 Você foi derrotado na masmorra... Game Over!");
      estado = "FIM";
      return;
    }
    atualizarPaineis();
  }

  inputElem.addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
      processarEntrada();
    }
  });

  iniciarJogo();
</script>

</body>
</html>
